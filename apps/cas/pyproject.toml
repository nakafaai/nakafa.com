[project]
name = "nakafa-cas"
version = "0.1.0"
requires-python = ">=3.12"
# The Cloudflare Python Worker vendors these with uv for its runtime (Python 3.13,
# Pyodide 0.28.3). That Pyodide index ships pydantic-core 2.27.2 as its only
# WebAssembly build, and Pydantic 2.10 is the release that requires it. SymPy 1.14
# is the version that basedpyright checks here; the index ships 1.13.3, and the
# Worker takes 1.14.0 from PyPI, which is pure Python.
dependencies = [
  "pydantic==2.10.6",
  "sympy==1.14.0",
]

[dependency-groups]
dev = [
  # 1.40 widens SymPy 1.14 factor(Expr) to Basic, rejecting valid scalar algebra.
  "basedpyright==1.39.10",
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.0",
  # Types for the `workers` module of entry.py, which exists only in the Worker runtime.
  "workers-runtime-sdk",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = [
  "-p",
  "no:cacheprovider",
  "--cov=cas",
  "--cov-branch",
  "--cov-fail-under=100",
  "--cov-report=term-missing",
]
python_files = ["*_test.py"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.basedpyright]
include = ["cas", "tests", "entry.py"]
typeCheckingMode = "standard"
# typings/_cloudflare declares the runtime module that only the Workers Python runtime
# provides, so its stub has no source to check.
reportMissingModuleSource = "none"
