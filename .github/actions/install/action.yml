name: Install dependencies
description: Sets up Node 24.22.1 and Bun without a cache, then installs the workspace from its frozen lockfile. The calling job checks out the repository first, because GitHub reads a local action from the checked-out workspace.
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.22.1
        package-manager-cache: false

    - name: Setup toolchain
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
        no-cache: true

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
