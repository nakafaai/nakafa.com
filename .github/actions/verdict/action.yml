name: Post a merge group's verdict
description: >-
  Posts `verify` for a merge group or its rehearsal once the gate and the three engines of this run have posted
  their own statuses, so the job that finishes last posts it (docs/adr/0048-proof.md, "A Merge Group Sets Aside What
  Its Base Fails"). Four successes pass at once and a failed gate fails. A passed gate beside a failed engine downloads
  the engines' results and proves the failing specs on main's head (`scripts/proof/group.ts`), reading a proof of the
  same specs on that commit that another group already started, which fails the group only on what main passes. The
  calling job checks out the head, installs the workspace and holds a token that may post statuses, read this run's
  artifacts and dispatch the proof workflow. The caller passes the statuses it just posted as `known`, and the read
  waits briefly for the others' (`.github/actions/statuses`).
inputs:
  known:
    description: The statuses the calling job just posted, one `context=state` per line
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read the four statuses
      id: statuses
      uses: ./.github/actions/statuses
      with:
        pattern: ^(gate|proof/(chromium|firefox|webkit))$
        count: 4
        known: ${{ inputs.known }}

    - name: Decide from the four statuses
      id: read
      if: steps.statuses.outputs.final == 'true'
      shell: bash
      env:
        STATES: ${{ steps.statuses.outputs.states }}
      run: |
        # GitHub's API now and then drops a call. A status post is idempotent per
        # context, so a dropped call is sent again, failing only after the third.
        retry() {
          for attempt in 1 2 3; do
            "$@" && return 0
            [ "$attempt" = 3 ] || sleep 5
          done
          return 1
        }
        post() {
          retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$1" -f context=verify -f target_url="$URL" -f description="$2"
        }
        if [ "$(jq 'all(.[]; . == "success")' <<< "$STATES")" = true ]; then
          post success "Gate, Chromium, Firefox and WebKit: success"
        elif [ "$(jq -r '.gate' <<< "$STATES")" != success ]; then
          post failure "Gate failed"
        else
          echo "judge=true" >> "$GITHUB_OUTPUT"
        fi

    # An engine whose build failed uploaded no result, and the verdict counts it
    # as one that never reported, so a download that finds none goes on.
    - name: Download the engines' results
      if: steps.read.outputs.judge == 'true'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: results-*
        path: ${{ runner.temp }}/group

    # The verdict posts `verify` itself and ends without error whatever it is;
    # an error before it posted leaves the failure that names this run.
    - name: Judge the failures against main
      if: steps.read.outputs.judge == 'true'
      shell: bash
      run: |
        # GitHub's API now and then drops a call. A status post is idempotent per
        # context, so a dropped call is sent again, failing only after the third.
        retry() {
          for attempt in 1 2 3; do
            "$@" && return 0
            [ "$attempt" = 3 ] || sleep 5
          done
          return 1
        }
        node scripts/proof/group.ts "$SHA" "$RUNNER_TEMP/group" "$URL" | tee -a "$GITHUB_STEP_SUMMARY" \
          || retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=failure -f context=verify -f target_url="$URL" -f description="The verdict against main failed: see this run"
