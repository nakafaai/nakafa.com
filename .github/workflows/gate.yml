# Runs the static half of a head's verification (AGENTS.md, Deployment) on
# GitHub's free public-repository runners, on demand, for the sessions and the
# landing train that call `bun run gate <sha>`: the typechecks with the committed
# bindings unchanged, every unit suite at its per-file 100% coverage gate, the
# source and policy checks with Ultracite, React Doctor for the head's React
# changes against main, and the dependency audit.
#
# Three parts share the account's 20 concurrent jobs with the proofs, so the gate
# takes as few machines as its slowest suites allow: `static` runs everything but
# the two large unit suites, which `www` and `backend` run beside it. Each part
# posts `gate/<part>` on the head and the report posts `gate`, which the landing
# train requires beside the proof. It is a tool, not a required check: no ruleset
# names it. It reads no secret, publishes nothing and touches no Convex or
# Cloudflare deployment (docs/adr/0048-proof.md, Gate).
name: Gate
run-name: Gate ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The exact 40-character head to gate
        required: true
        type: string

# No concurrency group: a cancelled run would still post its parts as failed over
# a newer run's, and `bun run gate` reads only statuses posted after it dispatched.
permissions: {}

env:
  # The landing train's tests write commits, as the train does on the Mac, so the
  # runner names an author the way the Mac's Git configuration does.
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]

jobs:
  check:
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        part: [ static, www, backend ]
    env:
      GH_TOKEN: ${{ github.token }}
      PART: ${{ matrix.part }}
      SHA: ${{ inputs.sha }}
      URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark the part pending
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lower-case commit SHA." >&2; exit 1; }
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending -f context="gate/$PART" -f target_url="$URL" -f description="Gating"

      # Coverage counts the files changed since origin/main, and React Doctor
      # compares the head with main, so every part reads the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install

      # The CAS engine's typecheck, lint and tests in the static part run its Python tools through uv.
      - name: Set up uv for the CAS engine
        if: matrix.part == 'static'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          # The default glob walks every folder, node_modules included, for 3.5 minutes.
          cache-dependency-glob: apps/cas/uv.lock

      # The static part runs every command, so one failure never hides another.
      # The www typecheck validates its environment while it loads its config: it
      # takes the inert loopback addresses AGENTS.md names, never a deployment's,
      # and the unit suites run without them, as on the Mac.
      - name: Run ${{ matrix.part }}
        id: part
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$PART" in
            static)
              failed=0
              # The Effect-patched compiler fails on suggestions without the word
              # "error", so the exit code is the verdict.
              CONVEX_URL=http://127.0.0.1:3210 CONVEX_SITE_URL=http://127.0.0.1:3211 \
                bun run turbo run typecheck --continue=dependencies-successful || failed=1
              # A head whose committed bindings differ from what its code generates is not ready.
              git status --porcelain -- packages/backend/confect/_generated packages/backend/convex/_generated
              test -z "$(git status --porcelain -- packages/backend/confect/_generated packages/backend/convex/_generated)" || failed=1
              bun run lint || failed=1
              bun run doctor --verbose --scope changed --base origin/main --blocking warning || failed=1
              bun run security:audit || failed=1
              bun run test:scripts || failed=1
              # One suite at a time: a runner has 4 cores, and the suites time some
              # of their tests, so each takes the whole machine as it does on the Mac.
              bun run turbo run test --concurrency=1 --filter='!@repo/backend' --filter='!www' || failed=1
              exit "$failed"
              ;;
            www) bun run turbo run test --filter=www ;;
            backend) bun run turbo run test --filter=@repo/backend ;;
            *) echo "Unknown part $PART." >&2; exit 1 ;;
          esac

      - name: Post the part
        if: always()
        env:
          OUTCOME: ${{ steps.part.outcome }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="gate/$PART" -f target_url="$URL" -f description="${OUTCOME:-did not run}"

  report:
    name: Report
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the gate
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          SHA: ${{ inputs.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=gate -f target_url="$URL" \
            -f description="Typechecks, unit suites, policy, Doctor and audit: $state"
