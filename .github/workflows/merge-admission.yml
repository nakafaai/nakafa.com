name: Merge Admission

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: Merge Admission-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  admission:
    name: Merge Admission
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify pull request provenance
        if: github.event_name == 'pull_request_target'
        env:
          EVENT_ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$EVENT_ACTOR" != "nabilfatih" ] || \
            [ "$PR_AUTHOR" != "nabilfatih" ] || \
            [ "$PR_BASE_REF" != "main" ] || \
            [ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "Pull request provenance is not trusted for signed acceptance." >&2
            exit 1
          fi

          echo "Pull request provenance verified for merge admission."

      - name: Verify merge group provenance
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          trusted_script="$RUNNER_TEMP/verify-merge-group-provenance.sh"
          trap 'rm -f -- "$trusted_script"' EXIT
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/scripts/verify-merge-group-provenance.sh?ref=$MERGE_GROUP_BASE_SHA" \
            > "$trusted_script"
          chmod 500 "$trusted_script"
          "$trusted_script"
