name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DIRECT_TRUSTED_CONTENT_ENVIRONMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'nabilfatih' && github.actor == 'nabilfatih' }}
    outputs:
      required: ${{ steps.classify.outputs.required == 'true' || (steps.classify.outputs.required == '' && steps.default.outputs.required == 'true') }}
      trusted: ${{ steps.trust.outputs.trusted }}
    steps:
      - name: Set fail-closed default
        id: default
        env:
          REQUIRED: true
        run: |
          echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An untrusted candidate is data for the classifier, never its code.
          ref: ${{ env.DIRECT_TRUSTED_CONTENT_ENVIRONMENT == 'true' && github.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch exact candidate for classification
        env:
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PULL_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export trusted candidate decision
        id: trust
        env:
          DIRECT_TRUST: ${{ env.DIRECT_TRUSTED_CONTENT_ENVIRONMENT }}
        run: |
          echo "trusted=$DIRECT_TRUST" >> "$GITHUB_OUTPUT"

      - name: Classify production acceptance
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm ci:production-acceptance

  quality:
    name: Quality
    needs: scope
    # The advisory registry is live state, so every current tree runs the audit.
    if: always() && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    # Keep bounded fail-closed advisory retries inside the aggregate job budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/cas/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: bash scripts/osv

      - name: Run tests
        run: pnpm test

  production:
    name: Production
    # Signed acceptance runs only for trusted same-repository candidates when
    # they contain production-relevant changes. Test-only candidates retain
    # Quality while Production is skipped.
    needs: scope
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.required == 'true' && needs.scope.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      runtime-selection: ${{ steps.production_build.outputs.CONTENT_RUNTIME_SELECTION_HASH }}
    env:
      CONTENT_RUNTIME_BUILD: local-static
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_POSTHOG_KEY: phc_ci_disabled
      NEXT_PUBLIC_POSTHOG_UI_HOST: https://eu.posthog.com
      POSTHOG_PROXY_HOST: https://t.nakafa.com
      SITE_URL: http://localhost:3000
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/cas/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export app version
        run: |
          app_version="$(node -p 'require("./package.json").version')"
          echo "NEXT_PUBLIC_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Build production app
        id: production_build
        run: pnpm build
        env:
          CONTENT_RUNTIME_CACHE_KEY: ${{ secrets.CONTENT_RUNTIME_CACHE_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_EXPOSE_TESTING_API: "true"
          NODE_ENV: production
          TURBO_CONCURRENCY: "2"

      - name: Start web app
        run: |
          umask 077
          web_log="$RUNNER_TEMP/runtime-www.log"
          web_pid="$RUNNER_TEMP/runtime-www.pid"
          : > "$web_log"
          chmod 600 "$web_log"
          setsid pnpm start > "$web_log" 2>&1 &
          echo "$!" > "$web_pid"

      - name: Wait for web app
        run: |
          for _attempt in {1..60}; do
            if curl -fsS http://localhost:3000/llms.txt > /dev/null && \
              curl -fsS http://localhost:3000/sitemap.xml > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The local production app did not become ready." >&2
          exit 1

      - name: Install Chromium
        run: pnpm --filter www exec playwright install --with-deps chromium

      - name: Run production browser checks
        id: production_browser
        run: pnpm --filter www test:browser

      - name: Archive production browser failures
        if: failure() && steps.production_browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: www-production-browser-failures-${{ github.run_attempt }}
          path: .cache/playwright/www
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Run site checks
        run: pnpm check:site

      - name: Verify final production runtime generation
        env:
          CONTENT_RUNTIME_SELECTION_HASH: ${{ steps.production_build.outputs.CONTENT_RUNTIME_SELECTION_HASH }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --silent --dir packages/backend runtime:ci verify-generations

      - name: Stop local services and erase temporary state
        if: always()
        run: |
          stop_process_group() {
            local pid_file="$1"
            if [ ! -f "$pid_file" ]; then
              return
            fi

            local pid
            pid="$(cat "$pid_file")"
            case "$pid" in
              *[!0-9]* | "")
                echo "Invalid local service process ID." >&2
                return 1
                ;;
            esac

            kill -- "-$pid" 2> /dev/null || true
            for _attempt in {1..20}; do
              if ! kill -0 -- "-$pid" 2> /dev/null; then
                return
              fi
              sleep 0.25
            done
            kill -KILL -- "-$pid" 2> /dev/null || true
          }

          test -n "${RUNNER_TEMP:-}"
          stop_process_group "$RUNNER_TEMP/runtime-www.pid"
          pnpm runtime:clean
          rm -f -- "$RUNNER_TEMP/runtime-www.log" "$RUNNER_TEMP/runtime-www.pid"

  doctor:
    name: Doctor
    if: always()
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run changed React Doctor
        if: needs.scope.result == 'success'
        env:
          DOCTOR_BASE: origin/main
        run: pnpm run doctor --verbose --scope changed --base "$DOCTOR_BASE" --include-untracked --blocking warning

      - name: Mark current-tree Doctor complete
        if: needs.scope.result == 'success'
        id: full
        run: true

      - name: Verify Doctor result
        if: always()
        env:
          FULL_OUTCOME: ${{ steps.full.outcome }}
          PRODUCTION_OUTCOME: skipped
          PRODUCTION_REQUIRED: ${{ needs.scope.outputs.required }}
          SCOPE_OUTCOME: ${{ needs.scope.result }}
          TRUSTED_CANDIDATE: ${{ needs.scope.outputs.trusted }}
        run: pnpm ci:gate doctor

  required:
    name: Required
    if: always()
    needs: [scope, quality, production, doctor]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production selection before final acceptance
        if: needs.scope.result == 'success' && needs.scope.outputs.trusted == 'true' && needs.scope.outputs.required == 'true' && needs.production.result == 'success'
        env:
          CONTENT_RUNTIME_SELECTION_HASH: ${{ needs.production.outputs.runtime-selection }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --silent --dir packages/backend runtime:ci verify-generations

      - name: Verify required result
        if: always()
        env:
          FULL_OUTCOME: ${{ needs.quality.result }}
          PRODUCTION_OUTCOME: ${{ needs.production.result }}
          PRODUCTION_REQUIRED: ${{ needs.scope.outputs.required }}
          SCOPE_OUTCOME: ${{ needs.scope.result }}
          TRUSTED_CANDIDATE: ${{ needs.scope.outputs.trusted }}
        run: pnpm ci:gate required
