name: CI

on:
  # Checks belong to the head commit, so title and body edits never rerun CI.
  # Stacked pull requests run on their own base, so their head already carries
  # checks when GitHub retargets them to main.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue reruns every required check on each queued change combined
  # with main and the changes queued ahead of it, so ready pull requests never
  # update from main just to merge.
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  # A pull request supersedes its own earlier runs. Merge groups key on their
  # immutable commit and are never cancelled, so a later change cannot cancel
  # a run the queue is waiting for.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Inert public values that the www typecheck and build validate while Next.js
# loads its config. Never put deployment values here.
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_POSTHOG_KEY: phc_ci_disabled
  NEXT_PUBLIC_POSTHOG_UI_HOST: https://eu.posthog.com
  POSTHOG_PROXY_HOST: https://t.nakafa.com
  SITE_URL: http://localhost:3000

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Signed acceptance trusts the owner's same-repository pull requests and
      # the merge groups the owner enqueued. Only the owner can enqueue, and
      # every queued pull request already passed Required, which rejects
      # untrusted production changes.
      TRUSTED_CANDIDATE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'nabilfatih' && github.actor == 'nabilfatih') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && github.actor == 'nabilfatih') }}
    outputs:
      required: ${{ steps.classify.outputs.required == 'true' || (steps.classify.outputs.required == '' && steps.default.outputs.required == 'true') }}
      trusted: ${{ steps.trust.outputs.trusted }}
    steps:
      - name: Set fail-closed default
        id: default
        env:
          REQUIRED: true
        run: |
          echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # An untrusted candidate is data for the classifier, never its code.
          ref: ${{ env.TRUSTED_CANDIDATE == 'true' && github.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0

      - name: Fetch exact candidate for classification
        env:
          CANDIDATE_REF: ${{ github.event.merge_group.head_ref || format('refs/pull/{0}/head', github.event.pull_request.number) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"

      - name: Setup toolchain
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export trusted candidate decision
        id: trust
        run: |
          echo "trusted=$TRUSTED_CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Classify production acceptance
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: pnpm ci:production-acceptance

  quality:
    name: Quality
    needs: scope
    # The advisory registry is live state, so every current tree runs the audit.
    if: ${{ !cancelled() && needs.scope.result == 'success' }}
    runs-on: ubuntu-latest
    # Keep bounded fail-closed advisory retries inside the aggregate job budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/cas/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: bash scripts/osv

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        # Production receives these from the acceptance runtime.
        env:
          CONTENT_RUNTIME_TOKEN: ci-typecheck
          CONVEX_SITE_URL: http://127.0.0.1:3211
          CONVEX_URL: http://127.0.0.1:3210
          NAKAFA_CONVEX_SITE_URL: http://127.0.0.1:3211
          NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_POLAR_SERVER: sandbox
        run: pnpm -r run typecheck

      - name: Verify generated backend contracts
        # The backend typecheck regenerates the Convex bindings before tsc runs,
        # so this proves the committed bindings are current.
        run: test -z "$(git status --porcelain -- packages/backend/confect/_generated packages/backend/convex)"

      - name: Run tests
        # The backend suite runs in its own job. Its filter keeps it out of this
        # run. The test tasks in turbo.json reach other packages only through
        # transit nodes, which run no tests.
        run: |
          pnpm check:patches
          pnpm check:tests
          pnpm test:scripts
          pnpm exec turbo run test --filter='!@repo/backend'

  backend:
    name: Backend
    needs: scope
    # The backend suite takes most of the test time, so it runs in its own job.
    # The package directory runs its own test script. A workspace filter would
    # exit 0 without running anything when that script is missing.
    if: ${{ !cancelled() && needs.scope.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --dir packages/backend test

  production:
    name: Production
    # Signed acceptance runs only for trusted same-repository candidates when
    # they contain production-relevant changes. Candidates that change only
    # modified TS tests or documentation keep Quality while Production is
    # skipped; scripts/production/acceptance.ts lists the documentation paths.
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.required == 'true' && needs.scope.outputs.trusted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Each leg starts its own runtime and runs one browser suite, as named in
    # apps/www/playwright.config.ts. Fail-fast is off, so every leg finishes.
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, visual, navigation]
    env:
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/cas/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browsers need only the installed Playwright package, so they install
      # while acceptance prepares and builds instead of after them. Idle CPU and
      # disk priority leave the local backend's queries within Convex's limits.
      # Only the navigation suite runs WebKit: its visual card project serves
      # Safari on iPad and iPhone, so the other legs install Chromium alone.
      - name: Start browser install
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          browsers=chromium
          if [ "$SUITE" = navigation ]; then
            browsers="chromium webkit"
          fi
          setsid bash -c "nice -n 19 ionice -c 3 pnpm --filter www exec playwright install --with-deps $browsers; echo \$? > '$RUNNER_TEMP/browsers.exit'" \
            > "$RUNNER_TEMP/browsers.log" 2>&1 &

      # Quality regenerates the Confect output and verifies it unchanged for this
      # same commit, so prepare does not repeat that codegen.
      - name: Prepare signed acceptance publication
        run: pnpm --dir packages/backend acceptance prepare

      - name: Verify generated Convex bindings
        run: test -z "$(git status --porcelain -- packages/backend/convex/_generated)"

      # Prepare already generated the bindings and the step above proved them
      # unchanged, so build and start call the backend acceptance command
      # directly instead of regenerating the bindings again.
      - name: Build production app
        id: production_build
        run: pnpm --dir packages/backend acceptance build
        env:
          NEXT_EXPOSE_TESTING_API: "true"
          NODE_ENV: production
          TURBO_CONCURRENCY: "2"

      - name: Start web app
        env:
          PORTLESS: "0"
        run: |
          umask 077
          web_log="$RUNNER_TEMP/runtime-www.log"
          web_pid="$RUNNER_TEMP/runtime-www.pid"
          : > "$web_log"
          chmod 600 "$web_log"
          setsid pnpm --dir packages/backend acceptance start > "$web_log" 2>&1 &
          echo "$!" > "$web_pid"

      - name: Wait for web app
        run: |
          for _attempt in {1..60}; do
            if curl -fsS http://localhost:3000/llms.txt > /dev/null && \
              curl -fsS http://localhost:3000/sitemap.xml > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The local production app did not become ready." >&2
          exit 1

      - name: Wait for browsers
        run: |
          for _attempt in {1..300}; do
            if [ -s "$RUNNER_TEMP/browsers.exit" ]; then
              cat "$RUNNER_TEMP/browsers.log"
              exit "$(cat "$RUNNER_TEMP/browsers.exit")"
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/browsers.log"
          echo "The browsers did not finish installing." >&2
          exit 1

      - name: Run production browser checks
        id: production_browser
        env:
          PLAYWRIGHT_SUITE: ${{ matrix.suite }}
        run: pnpm --filter www test:browser

      - name: Archive production browser failures
        if: failure() && steps.production_browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: www-production-browser-failures-${{ matrix.suite }}-${{ github.run_attempt }}
          path: .cache/playwright/www
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Run site checks
        # The site checks read the local app once, so only the runtime leg runs them.
        if: matrix.suite == 'runtime'
        run: pnpm check:site

      - name: Stop local services and erase temporary state
        if: always()
        run: |
          stop_process_group() {
            local pid_file="$1"
            if [ ! -f "$pid_file" ]; then
              return
            fi

            local pid
            pid="$(cat "$pid_file")"
            case "$pid" in
              *[!0-9]* | "")
                echo "Invalid local service process ID." >&2
                return 1
                ;;
            esac

            kill -- "-$pid" 2> /dev/null || true
            # Allow the scoped 15-second app and 5-second backend shutdowns.
            for _attempt in {1..100}; do
              if ! kill -0 -- "-$pid" 2> /dev/null; then
                return
              fi
              sleep 0.25
            done
            kill -KILL -- "-$pid" 2> /dev/null || true
          }

          test -n "${RUNNER_TEMP:-}"
          stop_process_group "$RUNNER_TEMP/runtime-www.pid"
          pnpm acceptance:clean
          rm -f -- "$RUNNER_TEMP/runtime-www.log" "$RUNNER_TEMP/runtime-www.pid"

  doctor:
    name: Doctor
    if: ${{ !cancelled() }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run changed React Doctor
        if: needs.scope.result == 'success'
        env:
          # A merge group compares against its immutable queue base.
          DOCTOR_BASE: ${{ github.event.merge_group.base_sha || 'origin/main' }}
        run: pnpm run doctor --verbose --scope changed --base "$DOCTOR_BASE" --include-untracked --blocking warning

      - name: Mark current-tree Doctor complete
        if: needs.scope.result == 'success'
        id: full
        run: true

      - name: Verify Doctor result
        if: always()
        env:
          FULL_OUTCOME: ${{ steps.full.outcome }}
          PRODUCTION_OUTCOME: skipped
          PRODUCTION_REQUIRED: ${{ needs.scope.outputs.required }}
          SCOPE_OUTCOME: ${{ needs.scope.result }}
          TRUSTED_CANDIDATE: ${{ needs.scope.outputs.trusted }}
        run: pnpm ci:gate doctor

  required:
    name: Required
    if: ${{ !cancelled() }}
    needs: [scope, quality, backend, production, doctor]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required result
        if: always()
        env:
          BACKEND_OUTCOME: ${{ needs.backend.result }}
          FULL_OUTCOME: ${{ needs.quality.result }}
          PRODUCTION_OUTCOME: ${{ needs.production.result }}
          PRODUCTION_REQUIRED: ${{ needs.scope.outputs.required }}
          SCOPE_OUTCOME: ${{ needs.scope.result }}
          TRUSTED_CANDIDATE: ${{ needs.scope.outputs.trusted }}
        run: pnpm ci:gate required
