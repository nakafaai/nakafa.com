name: Refresh PR lockfile

on:
  push:
    branches:
      - chore/orynth-ownership-verification

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore(deps): prepare fast-uri refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: chore/orynth-ownership-verification

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: false
          install: false

      - name: Refresh lockfile with pnpm
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "pnpm-lock.yaml"
          git diff --check
          git add pnpm-lock.yaml
          git diff --cached --quiet && {
            echo "pnpm produced no lockfile change" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh fast-uri lockfile"
          git push origin HEAD:chore/orynth-ownership-verification
