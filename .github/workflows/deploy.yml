name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [aksara-release]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy. Production deploys run only from main.
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'prod' }}
      NAKAFA_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard the stage
        shell: bash
        run: |
          case "$STAGE" in
            prod)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "Production deploys run only from main." >&2
                exit 1
              fi
              ;;
            staging) ;;
            *)
              echo "Unknown stage: $STAGE" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Deploy Convex to production
        if: env.STAGE == 'prod'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm codegen && pnpm exec convex deploy --yes

      - name: Deploy Convex to staging
        if: env.STAGE == 'staging'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
        run: pnpm codegen && pnpm exec convex deploy --yes

      - name: Set up uv for the CAS engine
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Deploy the Cloudflare stack
        working-directory: apps/www
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AKSARA_AGENT_SIGNING_KEY_ID: ${{ secrets.AKSARA_AGENT_SIGNING_KEY_ID }}
          AKSARA_AGENT_SIGNING_PUBLIC_KEY: ${{ secrets.AKSARA_AGENT_SIGNING_PUBLIC_KEY }}
          AKSARA_PREVIEW_EVENTS_PATH: ${{ secrets.AKSARA_PREVIEW_EVENTS_PATH }}
          AKSARA_PREVIEW_KEY_ID: ${{ secrets.AKSARA_PREVIEW_KEY_ID }}
          AKSARA_PREVIEW_MANIFEST_PATH: ${{ secrets.AKSARA_PREVIEW_MANIFEST_PATH }}
          AKSARA_PREVIEW_ORIGIN: ${{ secrets.AKSARA_PREVIEW_ORIGIN }}
          AKSARA_PREVIEW_PROVIDER_TOKEN: ${{ secrets.AKSARA_PREVIEW_PROVIDER_TOKEN }}
          AKSARA_PREVIEW_PUBLIC_KEY: ${{ secrets.AKSARA_PREVIEW_PUBLIC_KEY }}
          AKSARA_PREVIEW_RENDERER_SECRET: ${{ secrets.AKSARA_PREVIEW_RENDERER_SECRET }}
          AKSARA_PREVIEW_RENDERER_TOKEN: ${{ secrets.AKSARA_PREVIEW_RENDERER_TOKEN }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          CONTENT_RUNTIME_TOKEN: ${{ secrets.CONTENT_RUNTIME_TOKEN }}
          CONVEX_CLOUD_URL: ${{ secrets.CONVEX_CLOUD_URL }}
          NAKAFA_API_EDGE_SECRET: ${{ secrets.NAKAFA_API_EDGE_SECRET }}
          NAKAFA_CONVEX_SITE_URL: ${{ secrets.NAKAFA_CONVEX_SITE_URL }}
          NAKAFA_MCP_EDGE_SECRET: ${{ secrets.NAKAFA_MCP_EDGE_SECRET }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_POLAR_SERVER: ${{ vars.VITE_POLAR_SERVER }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_PROXY_HOST: ${{ vars.VITE_POSTHOG_PROXY_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.VITE_POSTHOG_UI_HOST }}
        run: pnpm exec alchemy deploy --stage "$STAGE" --yes
