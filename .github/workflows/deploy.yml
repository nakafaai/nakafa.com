name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        # An Aksara production release dispatches stage prod from main with the deploy app's token.
        description: Stage to deploy. Production deploys run only from main.
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The GitHub environment of the stage holds that stage's values and nothing else.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'staging' && 'staging' || 'production' }}
    env:
      # The one name of the deploy identity. The build reads it too: the prerender and the
      # static artifacts run in this process, before any Worker binding exists.
      NAKAFA_DEPLOY_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'prod' }}
      NAKAFA_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard the stage
        shell: bash
        run: |
          case "$NAKAFA_DEPLOY_STAGE" in
            prod)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "Production deploys run only from main." >&2
                exit 1
              fi
              ;;
            staging) ;;
            *)
              echo "Unknown stage: $NAKAFA_DEPLOY_STAGE" >&2
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/install

      # Every step that prepares the Cloudflare stack runs before Convex deploys. From
      # the Convex deploy until the new Worker is live, the old Worker serves against
      # the new functions, so nothing else may run in between.
      - name: Set up uv for the CAS engine
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Deploy Convex
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bun run codegen && bunx --no-install convex deploy --yes

      # Each value is named, so this step receives only what the build and the
      # Worker bindings read. `VITE_` values are variables, every other one a secret.
      - name: Deploy the Cloudflare stack
        working-directory: apps/www
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}
          CONVEX_CLOUD_URL: ${{ secrets.CONVEX_CLOUD_URL }}
          MATH_CAS_API_KEY: ${{ secrets.MATH_CAS_API_KEY }}
          NAKAFA_API_EDGE_SECRET: ${{ secrets.NAKAFA_API_EDGE_SECRET }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          NAKAFA_MCP_EDGE_SECRET: ${{ secrets.NAKAFA_MCP_EDGE_SECRET }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_PROXY_HOST: ${{ vars.VITE_POSTHOG_PROXY_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.VITE_POSTHOG_UI_HOST }}
        run: bunx --no-install alchemy deploy --stage "$NAKAFA_DEPLOY_STAGE" --yes
