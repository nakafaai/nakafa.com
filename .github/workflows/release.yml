name: Packages

on:
  push:
    branches:
      - main

concurrency:
  group: Release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: restore-store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests only restore the store. Main saves it once per lockfile,
      # pruned to exactly this install.
      - name: Prune pnpm store
        if: steps.restore-store.outputs.cache-hit != 'true'
        run: pnpm store prune

      - name: Save pnpm store
        if: steps.restore-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ${{ steps.pnpm-store.outputs.path }}

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore(release): version packages"
          version-script: pnpm changeset version
