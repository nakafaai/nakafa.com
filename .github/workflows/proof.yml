# Verifies one exact head on GitHub's free public-repository runners (AGENTS.md,
# Deployment): the gate (the typechecks with the committed bindings unchanged,
# every unit suite at its per-file 100% coverage gate, the source and policy
# checks with Ultracite, React Doctor for the head's React changes against main,
# and the dependency audit), and the proof (a production build served by the
# local production server over the local Convex backend binary, with the inert
# acceptance environment, and the chosen specs in Chromium, Firefox and WebKit).
#
# GitHub's merge queue requires one commit status, `verify`, and this workflow
# posts it at two depths (docs/adr/0048-proof.md, "The Merge Queue Is Switched
# On"). A pull request runs the gate alone, and the gate's verdict is `verify`.
# A merge group runs the gate and the three engines over the specs its diff
# selects (scripts/proof/select.ts), and the job that finishes last posts
# `verify` from the gate and the three engine statuses through
# .github/actions/verdict, which proves a failing spec on the group's base and
# sets aside what the base fails too ("A Merge Group Sets Aside What Its Base
# Fails"). `workflow_dispatch`
# serves `bun run gate`, whose gate also posts `verify`, `bun run proof`, and a
# merge group rehearsal that names its `base`.
#
# Each check runs once where it can fail ("Each Check Runs Once"): the specs in
# the merge group alone, React Doctor and the audit on the pull request alone.
#
# Jobs side by side and no `needs`: the gate, and up to four proof jobs per
# engine. Each proof job selects the run's specs first: a selection of at most
# ten specs installs, prepares and builds once on the first Chromium job, which
# runs the three engines one after another; one of at most 80 runs each engine
# on its own machine; a larger one, or every suite, splits each engine into up
# to four shards on machines of their own; every job its selection needs no
# machine for ends there. Every `needs` stage waits in the account's free runner
# queue again from the back, which turned 14 minutes of work into three hours,
# while jobs without one leave the queue together. Each job posts its own
# statuses: the gate `gate/<part>` and `gate`, the proof `proof/<engine>/<shard>`
# for a sharded engine, `proof/<engine>` from the job that finds all of an
# engine's shards final, and `proof` from the job that finds all three engine
# statuses of this run final.
#
# A push to main runs only the warming job, which saves main's prepared runtime
# and the browsers in main's scope, the only one a merge group can restore from.
#
# It reads no secret, publishes nothing and touches no Convex or Cloudflare
# deployment. A pull request from a fork gets a read-only token, so its run
# posts no status and it cannot enter the queue.
name: Proof
run-name: ${{ github.event_name == 'push' && 'Warm' || 'Proof' }} ${{ inputs.sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }} ${{ inputs.nonce }}

on:
  # A push to main warms the caches that merge groups restore: a group runs on a
  # gh-readonly-queue branch, which reads only main's caches, and what it saves
  # itself no later group can read.
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:
    inputs:
      sha:
        description: The exact 40-character head to verify
        required: true
        type: string
      specs:
        description: Spec files under apps/www, separated by spaces; empty proves every suite
        required: false
        default: ""
        type: string
      gate:
        description: Run the gate
        required: false
        default: true
        type: boolean
      proof:
        description: Build and run the specs
        required: false
        default: true
        type: boolean
      full:
        description: Typecheck and test every workspace, not only those the head changes against main
        required: false
        default: false
        type: boolean
      retries:
        description: Run a failing test once more before it fails its spec
        required: false
        default: true
        type: boolean
      base:
        description: Verify as a merge group on this base, selecting the specs from its diff to the head and posting verify
        required: false
        default: ""
        type: string
      nonce:
        description: Names this run, so the caller that dispatched it finds it
        required: false
        default: ""
        type: string

# A push to a pull request cancels the run of the head it replaced, whose
# statuses name that older head only, and a push to main cancels the warming of
# the main it replaced. Every other run has a group of its own, so a merge group
# or a dispatch is never cancelled by a later one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('proof-pull-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'proof-warm' || format('proof-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions: {}

env:
  SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
  BASE: ${{ github.event.merge_group.base_sha || inputs.base }}
  # Who posts `verify`: `gate`, the gate alone (a pull request or a dispatch
  # without the browsers); `group`, the last of the gate and the three engines
  # (a merge group or its rehearsal); empty, nobody (a proof or a baseline).
  VERIFY: ${{ (github.event_name == 'merge_group' || inputs.base != '') && 'group' || (github.event_name == 'pull_request' || !inputs.proof) && 'gate' || '' }}
  URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  gate:
    name: Gate
    # A draft runs nothing until it is marked ready for review.
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'merge_group' || inputs.gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # A group's verdict, which this job posts when it finishes last, proves
      # the failing specs on the base through a dispatched run of this workflow.
      actions: write
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      # A head typechecks and tests the workspaces it changes against main and
      # their dependents, and a merge group those its own pull requests change
      # against its base (main, or the head of the group ahead, which proves
      # its own); `full` runs every workspace.
      AFFECTED: ${{ !inputs.full && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || inputs.base || 'origin/main' }}
    steps:
      # `gate/backend` belongs to the backend job, whose first shard marks it
      # pending: this job may start after that shard has already posted it.
      - name: Mark the gate pending
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lower-case commit SHA." >&2; exit 1; }
          contexts=(gate gate/static gate/www)
          [ -z "$VERIFY" ] || contexts+=(verify)
          for context in "${contexts[@]}"; do
            retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=pending -f context="$context" -f target_url="$URL" -f description="Verifying"
          done

      # Coverage counts the files changed since origin/main, and React Doctor
      # compares the head with main, so the job reads the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install

      # The CAS engine's typecheck, lint and tests run its Python tools through uv.
      - name: Set up uv for the CAS engine
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          # The default glob walks every folder, node_modules included, for 3.5 minutes.
          cache-dependency-glob: apps/cas/uv.lock

      # Every gate step runs every command, so one failure never hides another.
      # The www typecheck validates its environment while it loads its config: it
      # takes the inert loopback addresses AGENTS.md names, never a deployment's.
      - name: Gate static
        id: static
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          failed=0
          # The Effect-patched compiler fails on suggestions without the word
          # "error", so the exit code is the verdict.
          CONVEX_URL=http://127.0.0.1:3210 CONVEX_SITE_URL=http://127.0.0.1:3211 \
            bun run turbo run typecheck --continue=dependencies-successful ${AFFECTED:+"$AFFECTED"} || failed=1
          # A head whose committed bindings differ from what its code generates is not ready.
          git status --porcelain -- packages/backend/confect/_generated packages/backend/convex/_generated
          test -z "$(git status --porcelain -- packages/backend/confect/_generated packages/backend/convex/_generated)" || failed=1
          bun run lint || failed=1
          # A package that reaches a workspace its tag denies (`boundaries` in turbo.json) is not ready.
          bun run boundaries || failed=1
          # Doctor reviews the head's own React changes against main, and the
          # audit reads live advisories, so both judge a pull request alone: in
          # a merge group Doctor would review the entries ahead again, and a new
          # advisory would stop the queue for nothing an entry in it changed.
          if [ "$VERIFY" != group ]; then
            bun run doctor --verbose --scope changed --base origin/main --blocking warning || failed=1
            bun run security:audit || failed=1
          fi
          bun run test:scripts || failed=1
          # One suite at a time: a runner has 4 cores, and the suites time some of
          # their tests, so each takes the whole machine as it does on the Mac.
          bun run turbo run test --concurrency=1 --filter='!@repo/backend' --filter='!www' ${AFFECTED:+"$AFFECTED"} || failed=1
          exit "$failed"

      - name: Gate www
        id: www
        if: always() && steps.static.outcome != 'skipped'
        run: bun run turbo run test --filter=www ${AFFECTED:+"$AFFECTED"}

      # The backend suite runs in the backend shards beside this one, and the
      # last of them posts `gate/backend`.
      - name: Post the gate's parts
        id: parts
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          WWW: ${{ steps.www.outcome }}
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          echo "known<<EOF" >> "$GITHUB_OUTPUT"
          for part in static www; do
            name=${part^^}
            outcome=${!name}
            state=failure
            [ "$outcome" = success ] && state=success
            retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$state" -f context="gate/$part" -f target_url="$URL" -f description="${outcome:-did not run}"
            echo "gate/$part=$state" >> "$GITHUB_OUTPUT"
          done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post the gate
        id: gate
        if: always()
        uses: ./.github/actions/gate
        with:
          known: ${{ steps.parts.outputs.known }}

      # The last of the gate and the three engines to post its own status finds
      # all four final and posts `verify`.
      - name: Post the group's verdict
        if: always() && env.VERIFY == 'group'
        uses: ./.github/actions/verdict
        with:
          known: ${{ steps.gate.outputs.state && format('gate={0}', steps.gate.outputs.state) || '' }}

  backend:
    # The backend suite, about 1,070 test files, runs in three shards on three
    # runners beside the gate, so it leaves the gate's critical path: one runner
    # took 10 to 14 minutes, and a fourth core saved a fifth of that. No job
    # waits on the shards: as the engines do for the verdict, the shard that
    # finishes last merges the three and posts `gate/backend`.
    name: Backend
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'merge_group' || inputs.gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Every shard reports, so the last one merges or names each.
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    permissions:
      # As for the gate: the shard that finishes last may post the group's verdict.
      actions: write
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      AFFECTED: ${{ !inputs.full && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || inputs.base || 'origin/main' }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
      # Turbo's first run prints a telemetry notice, which a step must not read.
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      # The first shard owns `gate/backend` from its start, before anything can
      # post it: the gate job, which may start later, leaves it alone, and the
      # shard that merges posts it only after this shard has finished.
      - name: Mark the backend part pending
        if: matrix.shard == 1
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending -f context=gate/backend -f target_url="$URL" -f description="Verifying"

      # Coverage counts the files changed since origin/main, and turbo measures
      # what the head changes, so the job reads the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install

      # A head that changes nothing the backend suite reads runs no shard: the
      # first shard posts `gate/backend` and the gate, and the others end here.
      - name: Ask whether the head reaches the backend
        id: affected
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          set -o pipefail
          tasks=1
          if [ -n "$AFFECTED" ]; then
            tasks="$(bun run turbo run test --filter=@repo/backend --affected --dry=json \
              | jq '[.tasks[] | select(.taskId == "@repo/backend#test")] | length')"
          fi
          # Anything but a count fails the step, so the shards report it instead of guessing.
          [[ "$tasks" =~ ^[0-9]+$ ]] || { echo "turbo answered no task count: '$tasks'" >&2; exit 1; }
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          [ "$tasks" != 0 ] || [ "$SHARD" != 1 ] || retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=gate/backend -f target_url="$URL" -f description="The head changes nothing the backend suite reads"

      - name: Post the gate
        id: idle
        if: steps.affected.outputs.tasks == '0' && matrix.shard == 1
        uses: ./.github/actions/gate
        with:
          known: gate/backend=success

      # A shard writes its results and its coverage as a blob and checks no
      # threshold, since a file's tests may stand in another shard; the last
      # shard checks the merged coverage. Nothing else runs on this runner, so
      # the suite takes every core.
      - name: Test one shard
        id: shard
        if: steps.affected.outputs.tasks != '0'
        run: |
          bun run turbo run test --filter=@repo/backend -- \
            --shard="$SHARD/$SHARDS" --reporter=blob --maxWorkers=100% \
            --coverage.thresholds.100=false --coverage.thresholds.perFile=false

      - name: Keep the shard's blob
        if: always() && steps.affected.outputs.tasks != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.shard }}
          include-hidden-files: true
          path: packages/backend/.vitest/blob
          if-no-files-found: ignore
          retention-days: 1

      # Each shard posts its own status after its blob is kept, then reads the
      # others', so the later reader finds all three final and merges.
      - name: Post the shard
        id: own
        if: always() && steps.affected.outputs.tasks != '0'
        env:
          OUTCOME: ${{ steps.shard.outcome }}
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          state=failure
          [ "$OUTCOME" = success ] && state=success
          retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="gate/backend-$SHARD" -f target_url="$URL" -f description="${OUTCOME:-did not run}"
          echo "known=gate/backend-$SHARD=$state" >> "$GITHUB_OUTPUT"

      - name: Read the shards
        id: shards
        if: always() && steps.affected.outputs.tasks != '0'
        uses: ./.github/actions/statuses
        with:
          pattern: ^gate/backend-[0-9]+$
          count: ${{ strategy.job-total }}
          known: ${{ steps.own.outputs.known }}

      - name: Decide whether this shard merges
        id: last
        if: always() && steps.shards.outputs.final == 'true'
        run: echo "merge=true" >> "$GITHUB_OUTPUT"

      - name: Download the shards' blobs
        if: always() && steps.last.outputs.merge == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-*
          merge-multiple: true
          path: packages/backend/.vitest/blob

      # Fewer blobs than shards is a shard that never wrote one.
      - name: Merge the shards
        id: merge
        if: always() && steps.last.outputs.merge == 'true'
        working-directory: packages/backend
        run: |
          blobs=$(find .vitest/blob -name 'blob-*.json' 2>/dev/null | wc -l)
          [ "$blobs" = "$SHARDS" ] || { echo "$blobs of $SHARDS shards wrote a blob." >&2; exit 1; }
          bunx vitest run --merge-reports

      - name: Post the backend part
        id: backend
        if: always() && steps.last.outputs.merge == 'true'
        env:
          OUTCOME: ${{ steps.merge.outcome }}
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          state=failure
          [ "$OUTCOME" = success ] && state=success
          retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=gate/backend -f target_url="$URL" -f description="${OUTCOME:-did not run}"
          echo "known=gate/backend=$state" >> "$GITHUB_OUTPUT"

      - name: Post the gate
        id: merged
        if: always() && steps.last.outputs.merge == 'true'
        uses: ./.github/actions/gate
        with:
          known: ${{ steps.backend.outputs.known }}

      - name: Post the group's verdict
        if: always() && env.VERIFY == 'group' && (steps.last.outputs.merge == 'true' || (steps.affected.outputs.tasks == '0' && matrix.shard == 1))
        uses: ./.github/actions/verdict
        with:
          known: ${{ (steps.merged.outputs.state || steps.idle.outputs.state) && format('gate={0}', steps.merged.outputs.state || steps.idle.outputs.state) || '' }}

  proof:
    # A fixed name: GitHub appends the matrix entry, Proof (chromium, firefox, webkit), and a job the event skips
    # reads Proof instead of the unexpanded expression, as a pull request showed it (owner, 15 Nov 2026).
    name: Proof
    if: github.event_name == 'merge_group' || inputs.proof
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # One machine's failure never stops another, so every engine reports.
      fail-fast: false
      matrix:
        # Up to four machines per engine. Each entry selects its specs first, in
        # seconds, and the entries its selection needs no machine for end there:
        # a selection of at most ONE_MACHINE_SPECS runs on the first Chromium
        # entry's one build in all three engines, one after another; one of at
        # most SHARD_SPECS runs each engine on its first entry, side by side; a
        # larger one, or every suite, splits each engine into one shard per
        # SHARD_SPECS specs, at most four. Twelve entries, the gate and the three
        # backend shards ask for 16 of the account's 20 free runners at once, so
        # every job leaves the queue together; an entry that ends holds its runner
        # for its install alone, about a minute.
        engine: [ chromium, firefox, webkit ]
        shard: [ 1, 2, 3, 4 ]
    permissions:
      # As for the gate: the job that finishes last posts the group's verdict.
      actions: write
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      ENGINE: ${{ matrix.engine }}
      SHARD: ${{ matrix.shard }}
      # A merge group's proof of its base retries no failing test (scripts/proof/github.ts, dispatchProof).
      ACCEPTANCE_RETRIES: ${{ github.event_name == 'workflow_dispatch' && !inputs.retries && '0' || '1' }}
      # The most specs that one machine runs in all three engines. A spec takes an
      # engine about 25 seconds on these runners (the median of 60 engine jobs on
      # 15 and 16 November 2026), and a machine's install, prepare, build and start
      # take 7 to 14 minutes. Above ten specs the two extra engines' time on one
      # machine (2 x 10 x 25 s, about 8 minutes) passes the build that a machine of
      # their own repeats, so they run side by side instead.
      ONE_MACHINE_SPECS: "10"
      # The most specs that one machine runs in one engine. Above it, the
      # engine's specs split into shards of about this many: 80 specs take an
      # engine about 33 minutes, and a machine of its own adds 7 to 14 minutes of
      # setup, so a second shard pays once the first would run past about 40.
      SHARD_SPECS: "80"
    steps:
      - name: Check the head
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lower-case commit SHA." >&2; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # Convex runs "use node" actions on the Node major that convex.json names,
      # which the acceptance runtime finds through CONVEX_NODE_BIN. It installs
      # before the workspace's Node, which then comes first on the PATH.
      - name: Name Node for Convex actions
        id: convex
        run: echo "node=$(jq -r .node.nodeVersion packages/backend/convex.json)" >> "$GITHUB_OUTPUT"

      - name: Install Node for Convex actions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.convex.outputs.node }}
          package-manager-cache: false

      - name: Point the runtime at Node for Convex actions
        run: echo "CONVEX_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: ./.github/actions/install

      # A merge group proves the specs its diff selects: those it changes, the
      # folders its app source paths name, and the smoke spec. A dispatch proves
      # the specs it names, or every suite.
      - name: Select the specs
        id: select
        env:
          NAMED: ${{ inputs.specs }}
        run: |
          specs="$NAMED"
          if [ -n "$BASE" ]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "base must be a full lower-case commit SHA." >&2; exit 1; }
            git fetch --quiet --no-tags --depth=1 origin "$BASE"
            specs="$(node scripts/proof/select.ts "$BASE" "$SHA")"
          fi
          [[ "$specs" =~ ^(e2e/[A-Za-z0-9/_.-]+\.browser\.ts( |$))*$ ]] || { echo "specs must be spec files under apps/www." >&2; exit 1; }
          echo "Specs: ${specs:-every suite}"
          # The engines this machine runs and each engine's number of shards:
          # all three on the first Chromium entry for a small selection, its own
          # engine on the first entry for a middle one, and its own engine's
          # shard for a large one or every suite, whose entries past the
          # engine's shards run nothing.
          count="$(wc -w <<< "$specs")"
          engines="$ENGINE"
          total=1
          if [ -z "$specs" ] || [ "$count" -gt "$SHARD_SPECS" ]; then
            total=4
            [ -z "$specs" ] || total=$(( (count + SHARD_SPECS - 1) / SHARD_SPECS ))
            [ "$total" -le 4 ] || total=4
          elif [ "$count" -le "$ONE_MACHINE_SPECS" ]; then
            [ "$ENGINE" = chromium ] && engines="chromium firefox webkit" || engines=""
          fi
          [ "$SHARD" -le "$total" ] || engines=""
          {
            echo "SPECS=$specs"
            echo "ENGINES=$engines"
            echo "ENGINES_KEY=${engines// /-}"
            echo "TOTAL=$total"
          } >> "$GITHUB_ENV"
          echo "${count} specs: this machine runs ${engines:-no engine}, shard ${SHARD} of ${total}"

      - name: Mark the engines pending
        if: env.ENGINES != ''
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          contexts=(proof)
          for engine in $ENGINES; do
            contexts+=("proof/$engine")
            [ "$TOTAL" = 1 ] || contexts+=("proof/$engine/$SHARD")
          done
          [ "$VERIFY" != group ] || contexts+=(verify)
          for context in "${contexts[@]}"; do
            retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=pending -f context="$context" -f target_url="$URL" -f description="Verifying"
          done

      - name: Name the browsers
        if: env.ENGINES != ''
        id: playwright
        working-directory: apps/www
        run: echo "version=$(bunx --no-install playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The browsers of one Playwright release never change, so a machine
      # downloads them only when no run of that release kept them.
      - name: Restore the browsers
        if: env.ENGINES != ''
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ env.ENGINES_KEY }}
          path: ~/.cache/ms-playwright

      # The engines install while the runtime prepares and builds. The system
      # libraries install only when a browser file links one the machine lacks,
      # or Firefox finds no virtual display. The apt timeout lets a silent mirror
      # fall back in ten seconds instead of thirty a file.
      - name: Start the browser install
        if: env.ENGINES != ''
        run: |
          echo 'Acquire::http::Timeout "10"; Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/99-mirror-timeout > /dev/null
          cat > "$RUNNER_TEMP/browsers.sh" <<'SCRIPT'
          set -e
          cd apps/www
          bunx --no-install playwright install $ENGINES
          missing=0
          for engine in $ENGINES; do
            for folder in "$HOME"/.cache/ms-playwright/"$engine"*; do
              # A browser loads its own libraries from its folders, as Playwright's check does.
              libraries="$(find "$folder" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
              if find "$folder" -type f \( -name '*.so*' -o -perm -u+x \) -print0 \
                | LD_LIBRARY_PATH="$libraries" xargs -0 ldd 2>/dev/null | grep -q '=> not found'; then
                missing=1
              fi
            done
          done
          case " $ENGINES " in *" firefox "*) command -v xvfb-run > /dev/null || missing=1 ;; esac
          echo "System libraries missing: $missing"
          # Playwright runs apt through sudo itself.
          [ "$missing" = 0 ] || bunx --no-install playwright install-deps $ENGINES
          SCRIPT
          (setsid bash -c "bash '$RUNNER_TEMP/browsers.sh'; echo \$? > '$RUNNER_TEMP/browsers.exit'" \
            > "$RUNNER_TEMP/browsers.log" 2>&1 &)

      # The proof reads the committed bindings, which the gate regenerates and
      # compares on the same head.
      - name: Name the prepared runtime
        if: env.ENGINES != ''
        id: key
        run: |
          key="$(bun run --cwd packages/backend acceptance key | grep -E '^[0-9a-f]{64}$' | tail -1)"
          [ -n "$key" ] || { echo "This head predates the proof runner: merge main into it." >&2; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "ACCEPTANCE_SNAPSHOTS=$RUNNER_TEMP/snapshots" >> "$GITHUB_ENV"

      - name: Restore the prepared runtime
        if: env.ENGINES != ''
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prepared-${{ steps.key.outputs.key }}
          path: |
            ${{ runner.temp }}/snapshots
            ~/.cache/convex/binaries

      - name: Prepare
        if: env.ENGINES != ''
        id: prepare
        run: bun run --cwd packages/backend acceptance prepare

      # Machines that prepare the same key race to save it; the first keeps it,
      # and the others' saves only warn.
      - name: Save the prepared runtime
        if: env.ENGINES != '' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prepared-${{ steps.key.outputs.key }}
          path: |
            ${{ runner.temp }}/snapshots
            ~/.cache/convex/binaries

      - name: Build
        if: env.ENGINES != ''
        id: build
        env:
          TURBO_CONCURRENCY: "2"
        run: bun run --cwd packages/backend acceptance build

      - name: Start
        if: env.ENGINES != ''
        run: |
          setsid bun run --cwd packages/backend acceptance start > "$RUNNER_TEMP/start.log" 2>&1 &
          for _ in $(seq 1 150); do
            curl -fsS -o /dev/null http://localhost:3000/llms.txt && exit 0
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/start.log"
          exit 1

      - name: Wait for the browsers
        if: env.ENGINES != ''
        run: |
          for _ in $(seq 1 300); do
            if [ -s "$RUNNER_TEMP/browsers.exit" ]; then
              tail -5 "$RUNNER_TEMP/browsers.log"
              exit "$(cat "$RUNNER_TEMP/browsers.exit")"
            fi
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/browsers.log"
          exit 1

      - name: Save the browsers
        if: env.ENGINES != '' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ env.ENGINES_KEY }}
          path: ~/.cache/ms-playwright

      # The engines run one after another against the one started app, each
      # writing its result whatever its specs do; a failing spec then fails this
      # step. Playwright empties its output folder on every run, so each engine's
      # traces move aside before the next engine starts.
      - name: Run specs
        if: env.ENGINES != ''
        env:
          # A runner has no GPU and no display, and headless Firefox finds no
          # GL driver there. It runs with a window on a virtual display, where
          # Mesa draws WebGL on the CPU. Chromium and WebKit bring their own.
          PLAYWRIGHT_FIREFOX_HEADED: "1"
        run: |
          status=0
          for engine in $ENGINES; do
            display=()
            if [ "$engine" = firefox ]; then
              display=(xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24")
            fi
            echo "::group::$engine"
            # shellcheck disable=SC2086
            "${display[@]}" bun run --cwd packages/backend acceptance shard "$engine" "$SHARD" "$TOTAL" "$RUNNER_TEMP/result/$engine" $SPECS || status=1
            echo "::endgroup::"
            if [ -d .cache/playwright/www ]; then
              mkdir -p "$RUNNER_TEMP/traces"
              mv .cache/playwright/www "$RUNNER_TEMP/traces/$engine"
            fi
            jq -e .passed "$RUNNER_TEMP/result/$engine/result.json" > /dev/null || status=1
          done
          exit "$status"

      # One artifact per engine's shard, `results-<engine>-<shard>`, whichever
      # machine ran it: `bun run proof` and the group's verdict read every
      # `results-*` the same way, and each result names its shard and total.
      - name: Keep the Chromium result
        if: always() && env.ENGINES != '' && contains(env.ENGINES, 'chromium')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-chromium-${{ env.SHARD }}
          path: ${{ runner.temp }}/result/chromium
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the Firefox result
        if: always() && env.ENGINES != '' && contains(env.ENGINES, 'firefox')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-firefox-${{ env.SHARD }}
          path: ${{ runner.temp }}/result/firefox
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the WebKit result
        if: always() && env.ENGINES != '' && contains(env.ENGINES, 'webkit')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-webkit-${{ env.SHARD }}
          path: ${{ runner.temp }}/result/webkit
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the traces of failures
        if: always() && env.ENGINES != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-${{ env.ENGINES_KEY }}-${{ env.SHARD }}
          path: |
            ${{ runner.temp }}/traces
            ${{ runner.temp }}/start.log
            ${{ runner.temp }}/browsers.log
          if-no-files-found: ignore
          retention-days: 3

      # An engine passes only when it reported and passed. It follows the
      # uploads, so a caller that sees `proof` finds every engine's result. A
      # sharded engine's machine posts `proof/<engine>/<shard>`, and the one that
      # finds all of its engine's shards final posts `proof/<engine>`, which
      # passes only when every shard does. The job that finds all three engine
      # statuses of this run final posts `proof`, which passes only when all
      # three do. Each job posts its own statuses before it reads the others, so
      # the last to finish always sees them all. `bun run proof` reads the same
      # results.
      - name: Post the proof
        id: proof
        # A selection that failed posts its own engine's failure, so no status waits.
        if: always() && (env.ENGINES != '' || steps.select.outcome != 'success')
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          post() {
            retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$2" -f context="$1" -f target_url="$URL" -f description="$3"
          }
          for engine in ${ENGINES:-$ENGINE}; do
            file="$RUNNER_TEMP/result/$engine/result.json"
            if [ ! -s "$file" ]; then
              state=failure; description="No result: the build or the start failed"
            elif [ "$(jq -r .passed "$file")" = true ]; then
              state=success; description="Every spec passed"
            else
              state=failure; description="$(jq -r '.failures | length' "$file") failing specs"
            fi
            # A sharded engine posts its shard; its engine waits for the others.
            context="proof/$engine"
            [ "${TOTAL:-1}" = 1 ] || context="proof/$engine/$SHARD"
            post "$context" "$state" "$description"
            echo "| $context | $state | $description |" >> "$GITHUB_STEP_SUMMARY"
            echo "$context=$state" >> "$GITHUB_OUTPUT.known"
          done
          { echo "known<<EOF"; cat "$GITHUB_OUTPUT.known"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          rm "$GITHUB_OUTPUT.known"

      # A sharded engine has one machine per shard, each with this one engine.
      - name: Read the engine's shards
        id: shards
        if: always() && env.ENGINES != '' && env.TOTAL != '1'
        uses: ./.github/actions/statuses
        with:
          pattern: ^proof/${{ env.ENGINE }}/[0-9]+$
          count: ${{ env.TOTAL }}
          known: ${{ steps.proof.outputs.known }}

      - name: Post the engine
        id: engine
        if: always() && steps.shards.outputs.final == 'true'
        env:
          STATES: ${{ steps.shards.outputs.states }}
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          state=failure
          [ "$(jq 'all(.[]; . == "success")' <<< "$STATES")" = true ] && state=success
          retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="proof/$ENGINE" -f target_url="$URL" -f description="$TOTAL shards: $state"
          echo "known=proof/$ENGINE=$state" >> "$GITHUB_OUTPUT"

      - name: Read the engines
        id: engines
        if: always() && (env.ENGINES != '' || steps.select.outcome != 'success')
        uses: ./.github/actions/statuses
        with:
          pattern: ^proof/(chromium|firefox|webkit)$
          count: 3
          known: |
            ${{ steps.proof.outputs.known }}
            ${{ steps.engine.outputs.known }}

      - name: Post the engines' verdict
        if: always() && steps.engines.outputs.final == 'true'
        env:
          STATES: ${{ steps.engines.outputs.states }}
        run: |
          # GitHub's API now and then drops a call. A status post is idempotent per
          # context, so a dropped call is sent again, failing only after the third.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || sleep 5
            done
            return 1
          }
          all=failure
          [ "$(jq 'all(.[]; . == "success")' <<< "$STATES")" = true ] && all=success
          retry gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$all" -f context=proof -f target_url="$URL" -f description="Chromium, Firefox and WebKit: $all"

      - name: Post the group's verdict
        if: always() && env.VERIFY == 'group' && (env.ENGINES != '' || steps.select.outcome != 'success')
        uses: ./.github/actions/verdict
        with:
          known: |
            ${{ steps.proof.outputs.known }}
            ${{ steps.engine.outputs.known }}

  # Prepares main's runtime and downloads the browsers once per push to main, and
  # saves both in main's scope, so a merge group whose head changes no backend
  # input restores its prepared runtime and every group restores its browsers.
  # It posts no status and builds nothing.
  warm:
    name: Warm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ENGINES: chromium firefox webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name Node for Convex actions
        id: convex
        run: echo "node=$(jq -r .node.nodeVersion packages/backend/convex.json)" >> "$GITHUB_OUTPUT"

      - name: Install Node for Convex actions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.convex.outputs.node }}
          package-manager-cache: false

      - name: Point the runtime at Node for Convex actions
        run: echo "CONVEX_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Name the browsers
        id: playwright
        working-directory: apps/www
        run: echo "version=$(bunx --no-install playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The key of the proof machine that runs all three engines.
      - name: Restore the browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit
          path: ~/.cache/ms-playwright

      - name: Download the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/www
        run: |
          read -ra engines <<< "$ENGINES"
          bunx --no-install playwright install "${engines[@]}"

      - name: Save the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit
          path: ~/.cache/ms-playwright

      - name: Name the prepared runtime
        id: key
        run: |
          key="$(bun run --cwd packages/backend acceptance key | grep -E '^[0-9a-f]{64}$' | tail -1)"
          [ -n "$key" ] || { echo "The prepared runtime has no key." >&2; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "ACCEPTANCE_SNAPSHOTS=$RUNNER_TEMP/snapshots" >> "$GITHUB_ENV"

      - name: Restore the prepared runtime
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prepared-${{ steps.key.outputs.key }}
          lookup-only: true
          path: |
            ${{ runner.temp }}/snapshots
            ~/.cache/convex/binaries

      - name: Prepare
        if: steps.restore.outputs.cache-hit != 'true'
        run: bun run --cwd packages/backend acceptance prepare

      - name: Save the prepared runtime
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prepared-${{ steps.key.outputs.key }}
          path: |
            ${{ runner.temp }}/snapshots
            ~/.cache/convex/binaries
