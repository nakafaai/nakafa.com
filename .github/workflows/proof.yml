# Verifies one exact head on GitHub's free public-repository runners (AGENTS.md,
# Deployment): the gate (the typechecks with the committed bindings unchanged,
# every unit suite at its per-file 100% coverage gate, the source and policy
# checks with Ultracite, React Doctor for the head's React changes against main,
# and the dependency audit), and the proof (a production build served by the
# local production server over the local Convex backend binary, with the inert
# acceptance environment, and the chosen specs in Chromium, Firefox and WebKit).
#
# GitHub's merge queue requires one commit status, `verify`, and this workflow
# posts it at two depths (docs/adr/0048-proof.md, "The Merge Queue Is Switched
# On"). A pull request runs the gate alone, and the gate's verdict is `verify`.
# A merge group runs the gate and the three engines over the specs its diff
# selects (scripts/proof/select.ts), and the job that finishes last posts
# `verify` from the gate and the three engine statuses through
# .github/actions/verdict, which proves a failing spec on the group's base and
# sets aside what the base fails too ("A Merge Group Sets Aside What Its Base
# Fails"). `workflow_dispatch`
# serves `bun run gate`, whose gate also posts `verify`, `bun run proof`, and a
# merge group rehearsal that names its `base`.
#
# Four jobs side by side and no `needs`: the gate, and one job per engine that
# installs, builds and proves on its own machine. Every `needs` stage waits in
# the account's free runner queue again from the back, which turned 14 minutes
# of work into three hours, while jobs without one leave the queue together.
# Each job posts its own statuses: the gate `gate/<part>` and `gate`, each
# engine `proof/<engine>`, and the engine that finishes last `proof`, read from
# the three engine statuses of this run.
#
# It reads no secret, publishes nothing and touches no Convex or Cloudflare
# deployment. A pull request from a fork gets a read-only token, so its run
# posts no status and it cannot enter the queue.
name: Proof
run-name: Proof ${{ inputs.sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha }} ${{ inputs.nonce }}

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:
    inputs:
      sha:
        description: The exact 40-character head to verify
        required: true
        type: string
      specs:
        description: Spec files under apps/www, separated by spaces; empty proves every suite
        required: false
        default: ""
        type: string
      gate:
        description: Run the gate
        required: false
        default: true
        type: boolean
      proof:
        description: Build and run the specs
        required: false
        default: true
        type: boolean
      full:
        description: Typecheck and test every workspace, not only those the head changes against main
        required: false
        default: false
        type: boolean
      base:
        description: Verify as a merge group on this base, selecting the specs from its diff to the head and posting verify
        required: false
        default: ""
        type: string
      nonce:
        description: Names this run, so the caller that dispatched it finds it
        required: false
        default: ""
        type: string

# A push to a pull request cancels the run of the head it replaced, whose
# statuses name that older head only. Every other run has a group of its own,
# so a merge group or a dispatch is never cancelled by a later one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('proof-pull-{0}', github.event.pull_request.number) || format('proof-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
  BASE: ${{ github.event.merge_group.base_sha || inputs.base }}
  # Who posts `verify`: `gate`, the gate alone (a pull request or a dispatch
  # without the browsers); `group`, the last of the gate and the three engines
  # (a merge group or its rehearsal); empty, nobody (a proof or a baseline).
  VERIFY: ${{ (github.event_name == 'merge_group' || inputs.base != '') && 'group' || (github.event_name == 'pull_request' || !inputs.proof) && 'gate' || '' }}
  URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  gate:
    name: Gate
    # A draft runs nothing until it is marked ready for review.
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'merge_group' || inputs.gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # A group's verdict, which this job posts when it finishes last, proves
      # the failing specs on the base through a dispatched run of this workflow.
      actions: write
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      # A head typechecks and tests the workspaces it changes against main and
      # their dependents, and a merge group those its own pull requests change
      # against its base (main, or the head of the group ahead, which proves
      # its own); `full` runs every workspace.
      AFFECTED: ${{ !inputs.full && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || inputs.base || 'origin/main' }}
    steps:
      - name: Mark the gate pending
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lower-case commit SHA." >&2; exit 1; }
          contexts=(gate gate/static gate/www gate/backend)
          [ -z "$VERIFY" ] || contexts+=(verify)
          for context in "${contexts[@]}"; do
            gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=pending -f context="$context" -f target_url="$URL" -f description="Verifying"
          done

      # Coverage counts the files changed since origin/main, and React Doctor
      # compares the head with main, so the job reads the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install

      # The CAS engine's typecheck, lint and tests run its Python tools through uv.
      - name: Set up uv for the CAS engine
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          # The default glob walks every folder, node_modules included, for 3.5 minutes.
          cache-dependency-glob: apps/cas/uv.lock

      # Every gate step runs every command, so one failure never hides another.
      # The www typecheck validates its environment while it loads its config: it
      # takes the inert loopback addresses AGENTS.md names, never a deployment's.
      - name: Gate static
        id: static
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          failed=0
          # The Effect-patched compiler fails on suggestions without the word
          # "error", so the exit code is the verdict.
          CONVEX_URL=http://127.0.0.1:3210 CONVEX_SITE_URL=http://127.0.0.1:3211 \
            bun run turbo run typecheck --continue=dependencies-successful ${AFFECTED:+"$AFFECTED"} || failed=1
          # A head whose committed bindings differ from what its code generates is not ready.
          git status --porcelain -- packages/backend/confect/_generated packages/backend/convex/_generated
          test -z "$(git status --porcelain -- packages/backend/confect/_generated packages/backend/convex/_generated)" || failed=1
          bun run lint || failed=1
          bun run doctor --verbose --scope changed --base origin/main --blocking warning || failed=1
          bun run security:audit || failed=1
          bun run test:scripts || failed=1
          # One suite at a time: a runner has 4 cores, and the suites time some of
          # their tests, so each takes the whole machine as it does on the Mac.
          bun run turbo run test --concurrency=1 --filter='!@repo/backend' --filter='!www' ${AFFECTED:+"$AFFECTED"} || failed=1
          exit "$failed"

      - name: Gate www
        id: www
        if: always() && steps.static.outcome != 'skipped'
        run: bun run turbo run test --filter=www ${AFFECTED:+"$AFFECTED"}

      # The backend suite runs in the backend shards beside this one, and the
      # last of them posts `gate/backend`.
      - name: Post the gate's parts
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          WWW: ${{ steps.www.outcome }}
        run: |
          for part in static www; do
            name=${part^^}
            outcome=${!name}
            state=failure
            [ "$outcome" = success ] && state=success
            gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$state" -f context="gate/$part" -f target_url="$URL" -f description="${outcome:-did not run}"
          done

      - name: Post the gate
        if: always()
        uses: ./.github/actions/gate

      # The last of the gate and the three engines to post its own status finds
      # all four final and posts `verify`.
      - name: Post the group's verdict
        if: always() && env.VERIFY == 'group'
        uses: ./.github/actions/verdict

  backend:
    # The backend suite, about 1,070 test files, runs in three shards on three
    # runners beside the gate, so it leaves the gate's critical path: one runner
    # took 10 to 14 minutes, and a fourth core saved a fifth of that. No job
    # waits on the shards: as the engines do for the verdict, the shard that
    # finishes last merges the three and posts `gate/backend`.
    name: Backend
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'merge_group' || inputs.gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Every shard reports, so the last one merges or names each.
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    permissions:
      # As for the gate: the shard that finishes last may post the group's verdict.
      actions: write
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      AFFECTED: ${{ !inputs.full && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.merge_group.base_sha || inputs.base || 'origin/main' }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      # Coverage counts the files changed since origin/main, and turbo measures
      # what the head changes, so the job reads the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install

      # A head that changes nothing the backend suite reads runs no shard: the
      # first shard posts `gate/backend` and the gate, and the others end here.
      - name: Ask whether the head reaches the backend
        id: affected
        run: |
          tasks=1
          if [ -n "$AFFECTED" ]; then
            tasks="$(bun run turbo run test --filter=@repo/backend --affected --dry=json \
              | jq '[.tasks[] | select(.taskId == "@repo/backend#test")] | length')"
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          [ "$tasks" != 0 ] || [ "$SHARD" != 1 ] || gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=gate/backend -f target_url="$URL" -f description="The head changes nothing the backend suite reads"

      - name: Post the gate
        if: steps.affected.outputs.tasks == '0' && matrix.shard == 1
        uses: ./.github/actions/gate

      # A shard writes its results and its coverage as a blob and checks no
      # threshold, since a file's tests may stand in another shard; the last
      # shard checks the merged coverage. Nothing else runs on this runner, so
      # the suite takes every core.
      - name: Test one shard
        id: shard
        if: steps.affected.outputs.tasks != '0'
        run: |
          bun run turbo run test --filter=@repo/backend -- \
            --shard="$SHARD/$SHARDS" --reporter=blob --maxWorkers=100% \
            --coverage.thresholds.100=false --coverage.thresholds.perFile=false

      - name: Keep the shard's blob
        if: always() && steps.affected.outputs.tasks != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.shard }}
          include-hidden-files: true
          path: packages/backend/.vitest/blob
          if-no-files-found: ignore
          retention-days: 1

      # Each shard posts its own status after its blob is kept, then reads the
      # others', so the later reader finds all three final and merges.
      - name: Post the shard
        id: last
        if: always() && steps.affected.outputs.tasks != '0'
        env:
          OUTCOME: ${{ steps.shard.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="gate/backend-$SHARD" -f target_url="$URL" -f description="${OUTCOME:-did not run}"
          final="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status?per_page=100" --jq \
            "[.statuses[] | select(.target_url == \"$URL\" and (.context | test(\"^gate/backend-[0-9]+\$\")) and .state != \"pending\")] | length")"
          [ "$final" = "$SHARDS" ] && echo "merge=true" >> "$GITHUB_OUTPUT" || true

      - name: Download the shards' blobs
        if: always() && steps.last.outputs.merge == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-*
          merge-multiple: true
          path: packages/backend/.vitest/blob

      # Fewer blobs than shards is a shard that never wrote one.
      - name: Merge the shards
        id: merge
        if: always() && steps.last.outputs.merge == 'true'
        working-directory: packages/backend
        run: |
          blobs=$(find .vitest/blob -name 'blob-*.json' 2>/dev/null | wc -l)
          [ "$blobs" = "$SHARDS" ] || { echo "$blobs of $SHARDS shards wrote a blob." >&2; exit 1; }
          bunx vitest run --merge-reports

      - name: Post the backend part
        if: always() && steps.last.outputs.merge == 'true'
        env:
          OUTCOME: ${{ steps.merge.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=gate/backend -f target_url="$URL" -f description="${OUTCOME:-did not run}"

      - name: Post the gate
        if: always() && steps.last.outputs.merge == 'true'
        uses: ./.github/actions/gate

      - name: Post the group's verdict
        if: always() && env.VERIFY == 'group' && (steps.last.outputs.merge == 'true' || (steps.affected.outputs.tasks == '0' && matrix.shard == 1))
        uses: ./.github/actions/verdict

  proof:
    # A fixed name: GitHub appends the engine, Proof (chromium), and a job the event skips reads Proof instead of
    # the unexpanded expression, as a pull request showed it (owner, 15 Nov 2026).
    name: Proof
    if: github.event_name == 'merge_group' || inputs.proof
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # One engine's failure never stops the others, so every engine reports.
      fail-fast: false
      matrix:
        engine: [ chromium, firefox, webkit ]
    permissions:
      # As for the gate: the engine that finishes last posts the group's verdict.
      actions: write
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - name: Mark the engine pending
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lower-case commit SHA." >&2; exit 1; }
          contexts=(proof "proof/$ENGINE")
          [ "$VERIFY" != group ] || contexts+=(verify)
          for context in "${contexts[@]}"; do
            gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=pending -f context="$context" -f target_url="$URL" -f description="Verifying"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install

      # A merge group proves the specs its diff selects: those it changes, the
      # folders its app source paths name, and the smoke spec. A dispatch proves
      # the specs it names, or every suite.
      - name: Select the specs
        env:
          NAMED: ${{ inputs.specs }}
        run: |
          specs="$NAMED"
          if [ -n "$BASE" ]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "base must be a full lower-case commit SHA." >&2; exit 1; }
            git fetch --quiet --no-tags --depth=1 origin "$BASE"
            specs="$(node scripts/proof/select.ts "$BASE" "$SHA")"
          fi
          [[ "$specs" =~ ^(e2e/[A-Za-z0-9/_.-]+\.browser\.ts( |$))*$ ]] || { echo "specs must be spec files under apps/www." >&2; exit 1; }
          echo "SPECS=$specs" >> "$GITHUB_ENV"
          echo "Specs: ${specs:-every suite}"

      # The engine installs while the runtime prepares and builds. The apt timeout
      # lets a silent mirror fall back in ten seconds instead of thirty a file.
      - name: Start the browser install
        run: |
          echo 'Acquire::http::Timeout "10"; Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/99-mirror-timeout > /dev/null
          (cd apps/www && setsid bash -c "bunx --no-install playwright install --with-deps $ENGINE; echo \$? > '$RUNNER_TEMP/browsers.exit'" \
            > "$RUNNER_TEMP/browsers.log" 2>&1 &)

      # Convex runs "use node" actions on the Node major that convex.json names,
      # which the acceptance runtime finds through Homebrew, as on the Mac.
      - name: Install Node for Convex actions
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          /home/linuxbrew/.linuxbrew/bin/brew install --quiet "node@$(jq -r .node.nodeVersion packages/backend/convex.json)"

      - name: Generate bindings
        run: bun run --cwd packages/backend codegen

      - name: Name the prepared runtime
        id: key
        run: |
          key="$(bun run --cwd packages/backend acceptance key | grep -E '^[0-9a-f]{64}$' | tail -1)"
          [ -n "$key" ] || { echo "This head predates the proof runner: merge main into it." >&2; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "ACCEPTANCE_SNAPSHOTS=$RUNNER_TEMP/snapshots" >> "$GITHUB_ENV"

      - name: Restore the prepared runtime
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prepared-${{ steps.key.outputs.key }}
          path: |
            ${{ runner.temp }}/snapshots
            ~/.cache/convex/binaries

      - name: Prepare
        id: prepare
        run: bun run --cwd packages/backend acceptance prepare

      # The three engines prepare the same key; the first to save keeps it, and
      # the others' saves only warn.
      - name: Save the prepared runtime
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prepared-${{ steps.key.outputs.key }}
          path: |
            ${{ runner.temp }}/snapshots
            ~/.cache/convex/binaries

      - name: Build
        id: build
        env:
          TURBO_CONCURRENCY: "2"
        run: bun run --cwd packages/backend acceptance build

      # A head whose committed bindings differ from what its own code generates is not ready.
      - name: Verify generated bindings
        run: |
          git status --porcelain -- packages/backend/confect/_generated packages/backend/convex/_generated
          test -z "$(git status --porcelain -- packages/backend/confect/_generated packages/backend/convex/_generated)"

      - name: Start
        run: |
          setsid bun run --cwd packages/backend acceptance start > "$RUNNER_TEMP/start.log" 2>&1 &
          for _ in $(seq 1 150); do
            curl -fsS -o /dev/null http://localhost:3000/llms.txt && exit 0
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/start.log"
          exit 1

      - name: Wait for the browser
        run: |
          for _ in $(seq 1 300); do
            if [ -s "$RUNNER_TEMP/browsers.exit" ]; then
              tail -5 "$RUNNER_TEMP/browsers.log"
              exit "$(cat "$RUNNER_TEMP/browsers.exit")"
            fi
            sleep 2
          done
          tail -50 "$RUNNER_TEMP/browsers.log"
          exit 1

      # The engine writes its result whatever its specs do; a failing spec then fails this step.
      - name: Run specs
        env:
          # A runner has no GPU and no display, and headless Firefox finds no
          # GL driver there. It runs with a window on a virtual display, where
          # Mesa draws WebGL on the CPU. Chromium and WebKit bring their own.
          PLAYWRIGHT_FIREFOX_HEADED: "1"
        run: |
          display=()
          if [ "$ENGINE" = firefox ]; then
            display=(xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24")
          fi
          # shellcheck disable=SC2086
          "${display[@]}" bun run --cwd packages/backend acceptance shard "$ENGINE" 1 1 "$RUNNER_TEMP/result" $SPECS || status=1
          jq -e .passed "$RUNNER_TEMP/result/result.json" > /dev/null && exit "${status:-0}"
          exit 1

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.engine }}
          path: ${{ runner.temp }}/result
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the traces of failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-${{ matrix.engine }}
          # Playwright writes into .cache, which the action skips unless told.
          include-hidden-files: true
          path: |
            .cache/playwright/www
            ${{ runner.temp }}/start.log
          if-no-files-found: ignore
          retention-days: 3

      # An engine passes only when it reported and passed. It follows the
      # uploads, so a caller that sees `proof` finds every engine's result. The
      # engine that finds all three engine statuses of this run final posts
      # `proof`, which passes only when all three do; each engine posts its own
      # status before it reads the others, so the last to finish always sees
      # them all. `bun run proof` reads the same results.
      - name: Post the proof
        if: always()
        run: |
          post() {
            gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$2" -f context="$1" -f target_url="$URL" -f description="$3"
          }
          file="$RUNNER_TEMP/result/result.json"
          if [ ! -s "$file" ]; then
            state=failure; description="No result: the build or the start failed"
          elif [ "$(jq -r .passed "$file")" = true ]; then
            state=success; description="Every spec passed"
          else
            state=failure; description="$(jq -r '.failures | length' "$file") failing specs"
          fi
          post "proof/$ENGINE" "$state" "$description"
          echo "| $ENGINE | $state | $description |" >> "$GITHUB_STEP_SUMMARY"
          states="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status?per_page=100" --jq \
            "[.statuses[] | select(.target_url == \"$URL\" and (.context | test(\"^proof/(chromium|firefox|webkit)\$\"))) | .state]")"
          [ "$(jq 'map(select(. != "pending")) | length' <<< "$states")" = 3 ] || exit 0
          all=failure
          [ "$(jq 'all(. == "success")' <<< "$states")" = true ] && all=success
          post proof "$all" "Chromium, Firefox and WebKit: $all"

      - name: Post the group's verdict
        if: always() && env.VERIFY == 'group'
        uses: ./.github/actions/verdict
