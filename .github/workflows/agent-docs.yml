name: Agent-Friendly Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-docs
  cancel-in-progress: false

jobs:
  agent-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONTENT_RUNTIME_TOKEN: ci-agent-docs
      CONVEX_SITE_URL: ${{ vars.AGENT_DOCS_CONVEX_SITE_URL }}
      CONVEX_URL: ${{ vars.AGENT_DOCS_CONVEX_URL }}
      INTERNAL_CONTENT_API_KEY: ci-agent-docs
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.AGENT_DOCS_CONVEX_SITE_URL }}
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.AGENT_DOCS_CONVEX_URL }}
      NEXT_PUBLIC_MCP_URL: https://mcp.nakafa.com
      NEXT_PUBLIC_POSTHOG_KEY: phc_agent_docs_ci
      NEXT_PUBLIC_POSTHOG_UI_HOST: https://eu.posthog.com
      POSTHOG_PROXY_HOST: https://t.nakafa.com
      SITE_URL: http://localhost:3000
      TRUSTED_CONTENT_ENVIRONMENT: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/cas/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export app version
        run: |
          app_version="$(node -p 'require("./package.json").version')"
          echo "NEXT_PUBLIC_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Run tests
        run: pnpm test

      - name: Deploy isolated backend
        if: env.TRUSTED_CONTENT_ENVIRONMENT == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.AGENT_DOCS_CONVEX_DEPLOY_KEY }}
        run: pnpm --dir packages/backend exec convex dev --once --typecheck enable --tail-logs disable

      - name: Sync real content
        if: env.TRUSTED_CONTENT_ENVIRONMENT == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.AGENT_DOCS_CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @repo/backend sync

      - name: Build production app
        if: env.TRUSTED_CONTENT_ENVIRONMENT == 'true'
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Start web app
        if: env.TRUSTED_CONTENT_ENVIRONMENT == 'true'
        run: |
          pnpm --filter www start > /tmp/nakafa-www.log 2>&1 &
          echo "$!" > /tmp/nakafa-www.pid

      - name: Wait for web app
        if: env.TRUSTED_CONTENT_ENVIRONMENT == 'true'
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/llms.txt > /dev/null && \
              curl -fsS http://localhost:3000/sitemap.xml > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nakafa-www.log
          exit 1

      - name: Run AFDocs checks
        if: env.TRUSTED_CONTENT_ENVIRONMENT == 'true'
        run: pnpm agent-docs

      - name: Print web app log after failure
        if: env.TRUSTED_CONTENT_ENVIRONMENT == 'true' && failure()
        run: |
          if [ -f /tmp/nakafa-www.log ]; then
            cat /tmp/nakafa-www.log
          fi

      - name: Stop web app
        if: env.TRUSTED_CONTENT_ENVIRONMENT == 'true' && always()
        run: |
          if [ -f /tmp/nakafa-www.pid ]; then
            kill "$(cat /tmp/nakafa-www.pid)" || true
          fi
