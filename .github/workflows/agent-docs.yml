name: Agent-Friendly Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/cas/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Run tests
        run: pnpm test

  production:
    name: Production acceptance
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'nabilfatih' && github.actor == 'nabilfatih')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONTENT_RUNTIME_TOKEN: ci-agent-docs
      INTERNAL_CONTENT_API_KEY: ci-agent-docs
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_MCP_URL: https://mcp.nakafa.com
      NEXT_PUBLIC_POSTHOG_KEY: phc_agent_docs_ci
      NEXT_PUBLIC_POSTHOG_UI_HOST: https://eu.posthog.com
      POSTHOG_PROXY_HOST: https://t.nakafa.com
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/cas/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export app version
        run: |
          app_version="$(node -p 'require("./package.json").version')"
          echo "NEXT_PUBLIC_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Fingerprint signed runtime contract
        run: |
          output="$RUNNER_TEMP/agent-docs-fingerprint.env"
          rm -f -- "$output"
          pnpm --silent --dir packages/backend runtime:ci fingerprint

          if [ ! -f "$output" ] || [ -L "$output" ] || \
            [ "$(stat -c '%a' "$output")" != "600" ] || \
            [ "$(wc -l < "$output")" -ne 2 ] || \
            ! grep -Exq 'AGENT_DOCS_CONTENT_CACHE_VERSION=v[0-9]+' "$output" || \
            ! grep -Exq 'AGENT_DOCS_RUNTIME_SCHEMA_FINGERPRINT=[a-f0-9]{64}' "$output"; then
            echo "Invalid signed runtime fingerprint output." >&2
            exit 1
          fi

          cat "$output" >> "$GITHUB_ENV"
          rm -f -- "$output"

      - name: Fingerprint production runtime generations
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.AGENT_DOCS_CONVEX_DEPLOY_KEY }}
        run: |
          output="$RUNNER_TEMP/agent-docs-generations.env"
          rm -f -- "$output"
          pnpm --silent --dir packages/backend runtime:ci generations

          if [ ! -f "$output" ] || [ -L "$output" ] || \
            [ "$(stat -c '%a' "$output")" != "600" ] || \
            [ "$(wc -l < "$output")" -ne 2 ] || \
            ! grep -Exq 'AGENT_DOCS_CONTENT_STATE_HASH=[a-f0-9]{64}' "$output" || \
            ! grep -Exq 'AGENT_DOCS_RUNTIME_SELECTION_HASH=[a-f0-9]{64}' "$output"; then
            echo "Invalid production runtime generation output." >&2
            exit 1
          fi

          cat "$output" >> "$GITHUB_ENV"
          rm -f -- "$output"

      - name: Verify selected production runtime generation
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.AGENT_DOCS_CONVEX_DEPLOY_KEY }}
        run: pnpm --silent --dir packages/backend runtime:ci verify-generations

      # Protected signed runtime, including tryout content, is never cached raw.
      - name: Restore encrypted signed content snapshot
        id: signed-content-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agent-docs-content-cache
          key: agent-docs-content-${{ env.AGENT_DOCS_CONTENT_CACHE_VERSION }}-${{ env.AGENT_DOCS_CONTENT_STATE_HASH }}-${{ env.AGENT_DOCS_RUNTIME_SCHEMA_FINGERPRINT }}

      - name: Export encrypted signed content snapshot
        if: steps.signed-content-cache.outputs.cache-hit != 'true'
        env:
          AGENT_DOCS_CONTENT_CACHE_KEY: ${{ secrets.AGENT_DOCS_CONTENT_CACHE_KEY_V1 }}
          CONVEX_DEPLOY_KEY: ${{ secrets.AGENT_DOCS_CONVEX_DEPLOY_KEY }}
        run: pnpm --silent --dir packages/backend runtime:ci export

      - name: Initialize anonymous local backend
        run: |
          umask 077
          CONVEX_AGENT_MODE=anonymous pnpm --dir packages/backend exec convex init

          convex_url="$(
            sed -n 's/^VITE_CONVEX_URL=//p' packages/backend/.env.local
          )"
          convex_site_url="$(
            sed -n 's/^VITE_CONVEX_SITE_URL=//p' packages/backend/.env.local
          )"
          case "$convex_url" in
            http://127.0.0.1:*) ;;
            *)
              echo "Anonymous Convex client URL is not local." >&2
              exit 1
              ;;
          esac
          case "$convex_site_url" in
            http://127.0.0.1:*) ;;
            *)
              echo "Anonymous Convex site URL is not local." >&2
              exit 1
              ;;
          esac

          {
            echo "CONVEX_AGENT_MODE=anonymous"
            echo "CONVEX_SITE_URL=$convex_site_url"
            echo "CONVEX_URL=$convex_url"
            echo "NEXT_PUBLIC_CONVEX_SITE_URL=$convex_site_url"
            echo "NEXT_PUBLIC_CONVEX_URL=$convex_url"
          } >> "$GITHUB_ENV"

      - name: Configure anonymous local backend
        run: |
          # Agent docs exercises content reads only. External integrations stay inert.
          pnpm --dir packages/backend exec convex env set --force <<EOF
          AI_GATEWAY_API_KEY=agent-docs-disabled
          AKSARA_PUBLICATION_TOKEN=$CONTENT_RUNTIME_TOKEN
          AUTH_GOOGLE_ID=agent-docs-disabled
          AUTH_GOOGLE_SECRET=agent-docs-disabled
          BETTER_AUTH_SECRET=agent-docs-inert-secret-00000000
          CONTENT_RUNTIME_TOKEN=$CONTENT_RUNTIME_TOKEN
          FIRECRAWL_API_KEY=agent-docs-disabled
          INTERNAL_CONTENT_API_KEY=$INTERNAL_CONTENT_API_KEY
          JWKS=[]
          NEXT_PUBLIC_POLAR_SERVER=sandbox
          OPENWEATHER_API_KEY=agent-docs-disabled
          POLAR_ACCESS_TOKEN=agent-docs-disabled
          POLAR_WEBHOOK_SECRET=agent-docs-disabled
          POSTHOG_ERASURE_API_KEY=agent-docs-disabled
          POSTHOG_HOST=https://example.invalid
          POSTHOG_PROJECT_ID=0
          POSTHOG_PROJECT_TOKEN=agent-docs-disabled
          RESEND_API_KEY=agent-docs-disabled
          RESEND_WEBHOOK_SECRET=agent-docs-disabled
          SITE_URL=$SITE_URL
          EOF

      - name: Start anonymous local backend
        run: |
          umask 077
          convex_log="$RUNNER_TEMP/agent-docs-convex.log"
          convex_pid="$RUNNER_TEMP/agent-docs-convex.pid"

          : > "$convex_log"
          chmod 600 "$convex_log"
          setsid pnpm --dir packages/backend exec convex dev \
            --typecheck enable \
            --tail-logs always > "$convex_log" 2>&1 &
          echo "$!" > "$convex_pid"

          for _attempt in {1..120}; do
            if ! kill -0 "$(cat "$convex_pid")" 2> /dev/null; then
              echo "The anonymous local backend exited before becoming ready." >&2
              exit 1
            fi
            if grep -Fq 'Convex functions ready!' "$convex_log" && \
              curl -fsS "$CONVEX_URL/instance_name" > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "The anonymous local backend did not become ready." >&2
          exit 1

      - name: Import signed content snapshot
        env:
          AGENT_DOCS_CONTENT_CACHE_KEY: ${{ secrets.AGENT_DOCS_CONTENT_CACHE_KEY_V1 }}
        run: pnpm --silent --dir packages/backend runtime:ci import

      - name: Verify signed featured renderer graph
        run: pnpm --filter www verify:featured-renderer

      - name: Build production app
        id: production_build
        run: pnpm build
        env:
          NEXT_EXPOSE_TESTING_API: "true"
          NODE_ENV: production

      - name: Classify local backend build failure
        if: failure() && steps.production_build.outcome == 'failure'
        env:
          AGENT_DOCS_CONTENT_STATE_HASH: ""
          AGENT_DOCS_RUNTIME_SELECTION_HASH: ""
          AGENT_DOCS_RUNTIME_SCHEMA_FINGERPRINT: ""
          CONTENT_RUNTIME_TOKEN: ""
          CONVEX_SITE_URL: ""
          CONVEX_URL: ""
          INTERNAL_CONTENT_API_KEY: ""
          NEXT_PUBLIC_APP_URL: ""
          NEXT_PUBLIC_CONVEX_SITE_URL: ""
          NEXT_PUBLIC_CONVEX_URL: ""
          NEXT_PUBLIC_MCP_URL: ""
          NEXT_PUBLIC_POSTHOG_KEY: ""
          NEXT_PUBLIC_POSTHOG_UI_HOST: ""
          POSTHOG_PROXY_HOST: ""
          SITE_URL: ""
        run: |
          convex_log="$RUNNER_TEMP/agent-docs-convex.log"
          log_class=unavailable
          event_class=unavailable
          request_id_present=false

          if [ -f "$convex_log" ] && [ ! -L "$convex_log" ] && \
            [ "$(stat -c '%a' "$convex_log")" = "600" ]; then
            log_class=private
            event_class=handled-or-unobserved
            if grep -Fq '[CONVEX Q(' "$convex_log"; then
              if grep -Fq '[CONVEX H(' "$convex_log"; then
                event_class=multiple
              else
                event_class=query
              fi
            elif grep -Fq '[CONVEX H(' "$convex_log"; then
              event_class=http-action
            fi
            if grep -Fq '[Request ID:' "$convex_log"; then
              request_id_present=true
            fi
          elif [ -e "$convex_log" ] || [ -L "$convex_log" ]; then
            log_class=unsafe
          fi

          printf '%s\n' \
            "local_backend_log_class=$log_class" \
            "local_backend_event_class=$event_class" \
            "local_backend_request_id_present=$request_id_present"

      - name: Start web app
        run: |
          umask 077
          web_log="$RUNNER_TEMP/agent-docs-www.log"
          web_pid="$RUNNER_TEMP/agent-docs-www.pid"
          : > "$web_log"
          chmod 600 "$web_log"
          setsid pnpm --filter www start > "$web_log" 2>&1 &
          echo "$!" > "$web_pid"

      - name: Wait for web app
        run: |
          for _attempt in {1..60}; do
            if curl -fsS http://localhost:3000/llms.txt > /dev/null && \
              curl -fsS http://localhost:3000/sitemap.xml > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The local production app did not become ready." >&2
          exit 1

      - name: Install Chromium
        run: pnpm --filter www exec playwright install --with-deps chromium

      - name: Run production browser checks
        id: production_browser
        run: pnpm --filter www test:browser

      - name: Archive production browser failures
        if: failure() && steps.production_browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: www-production-browser-failures-${{ github.run_attempt }}
          path: .cache/playwright/www
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Run AFDocs checks
        run: pnpm agent-docs

      - name: Verify final production runtime generation
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.AGENT_DOCS_CONVEX_DEPLOY_KEY }}
        run: pnpm --silent --dir packages/backend runtime:ci verify-generations

      - name: Save verified encrypted signed content snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signed-content-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agent-docs-content-cache
          key: ${{ steps.signed-content-cache.outputs.cache-primary-key }}

      - name: Stop local services and erase temporary state
        if: always()
        run: |
          stop_process_group() {
            local pid_file="$1"
            if [ ! -f "$pid_file" ]; then
              return
            fi

            local pid
            pid="$(cat "$pid_file")"
            case "$pid" in
              *[!0-9]* | "")
                echo "Invalid local service process ID." >&2
                return 1
                ;;
            esac

            kill -- "-$pid" 2> /dev/null || true
            for _attempt in {1..20}; do
              if ! kill -0 -- "-$pid" 2> /dev/null; then
                return
              fi
              sleep 0.25
            done
            kill -KILL -- "-$pid" 2> /dev/null || true
          }

          test -n "${RUNNER_TEMP:-}"
          stop_process_group "$RUNNER_TEMP/agent-docs-www.pid"
          stop_process_group "$RUNNER_TEMP/agent-docs-convex.pid"

          rm -rf -- \
            packages/backend/.convex \
            "$RUNNER_TEMP/agent-docs-content-cache"
          rm -f -- \
            packages/backend/.env.local \
            "$RUNNER_TEMP/agent-docs-fingerprint.env" \
            "$RUNNER_TEMP/agent-docs-generations.env" \
            "$RUNNER_TEMP/agent-docs-convex.log" \
            "$RUNNER_TEMP/agent-docs-convex.pid" \
            "$RUNNER_TEMP/agent-docs-www.log" \
            "$RUNNER_TEMP/agent-docs-www.pid"

          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'agent-docs-export-*' \
            -o -name 'agent-docs-generations-*' \
            -o -name 'agent-docs-import-*' \) \
            -exec rm -rf -- {} +

  agent-docs:
    if: always()
    needs: [quality, production]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PRODUCTION_RESULT: ${{ needs.production.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      TRUSTED_CONTENT_ENVIRONMENT: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'nabilfatih' && github.actor == 'nabilfatih') }}
    steps:
      - name: Verify acceptance jobs
        run: |
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "Quality checks finished with $QUALITY_RESULT." >&2
            exit 1
          fi

          if [ "$TRUSTED_CONTENT_ENVIRONMENT" = "true" ]; then
            if [ "$PRODUCTION_RESULT" != "success" ]; then
              echo "Production acceptance finished with $PRODUCTION_RESULT." >&2
              exit 1
            fi
            exit 0
          fi

          if [ "$PRODUCTION_RESULT" != "skipped" ]; then
            echo "Untrusted production acceptance finished with $PRODUCTION_RESULT." >&2
            exit 1
          fi
