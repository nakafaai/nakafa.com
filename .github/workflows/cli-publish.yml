name: Release CLI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  build:
    name: Verify
    if: github.ref == 'refs/heads/main' && github.repository == 'nakafaai/nakafa.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      size: ${{ steps.archive.outputs.size }}
      verifier_sha256: ${{ steps.archive.outputs.verifier_sha256 }}
      verifier_size: ${{ steps.archive.outputs.verifier_size }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Verify package
        run: |
          pnpm test:scripts
          pnpm --filter @nakafa/cli typecheck
          pnpm --filter @nakafa/cli test:coverage
          pnpm --filter @nakafa/cli build

      - name: Build release archive
        id: archive
        env:
          RELEASE_ROOT: ${{ runner.temp }}/cli-release
        run: |
          mkdir -p "$RELEASE_ROOT"
          pnpm exec esbuild scripts/github/provenance/main.ts \
            --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" \
            --bundle \
            --format=esm \
            --outfile="$RELEASE_ROOT/provenance.mjs" \
            --platform=node \
            --target=node24
          pack=$(npm pack packages/cli --ignore-scripts --json \
            --pack-destination "$RELEASE_ROOT")
          archive=$(jq -er '.[0].filename' <<< "$pack")
          tarball="$RELEASE_ROOT/$archive"
          verifier="$RELEASE_ROOT/provenance.mjs"
          package_json=$(tar -xOf "$tarball" package/package.json)
          package_name=$(jq -er '.name' <<< "$package_json")
          package_version=$(jq -er '.version' <<< "$package_json")
          if [[ "$package_name" != "@nakafa/cli" ]]; then
            echo "The CLI archive has an unexpected package identity." >&2
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "CLI production releases require a stable semantic version." >&2
            exit 1
          fi
          {
            echo "archive=$archive"
            echo "sha256=$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            echo "size=$(stat --format='%s' "$tarball")"
            echo "verifier_sha256=$(sha256sum "$verifier" | cut -d ' ' -f 1)"
            echo "verifier_size=$(stat --format='%s' "$verifier")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: cli-package
          path: ${{ runner.temp }}/cli-release/${{ steps.archive.outputs.archive }}
          retention-days: 1

      - name: Upload publication verifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: cli-verifier
          path: ${{ runner.temp }}/cli-release/provenance.mjs
          retention-days: 1

  publish:
    name: Publish
    needs: build
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-package
          path: .

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify and publish exact archive
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
          NPM_CLI: npm@12.0.2
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          TARBALL: ${{ github.workspace }}/${{ needs.build.outputs.archive }}
        run: |
          npm_version=$(npx --yes "$NPM_CLI" --version)
          if [[ "$npm_version" != "${NPM_CLI#npm@}" ]]; then
            echo "The trusted publisher requires the pinned npm CLI." >&2
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" \
            || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "The trusted publisher requires GitHub OIDC identity." >&2
            exit 1
          fi

          actual_sha256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)
          actual_size=$(stat --format='%s' "$TARBALL")
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" \
            || "$actual_size" != "$EXPECTED_SIZE" ]]; then
            echo "The transported archive differs from the verified build output." >&2
            exit 1
          fi

          package_json=$(tar -xOf "$TARBALL" package/package.json)
          package_name=$(jq -er '.name' <<< "$package_json")
          package_version=$(jq -er '.version' <<< "$package_json")
          if [[ "$package_name" != "@nakafa/cli" ]]; then
            echo "The transported CLI archive has an unexpected package identity." >&2
            exit 1
          fi
          package_specifier="$package_name@$package_version"
          expected_shasum=$(sha1sum "$TARBALL" | cut -d ' ' -f 1)
          expected_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"

          read_metadata() {
            local raw
            if ! raw=$(npx --yes "$NPM_CLI" view "$package_specifier" \
              name version dist.shasum dist.integrity \
              --json 2>/dev/null); then
              return 1
            fi
            jq -ce '
              if type == "array" and length == 1 then .[0]
              elif type == "object" then .
              else empty
              end
            ' <<< "$raw"
          }

          is_exact_package() {
            jq -e \
              --arg integrity "$expected_integrity" \
              --arg name "$package_name" \
              --arg shasum "$expected_shasum" \
              --arg version "$package_version" \
              '.name == $name
                and .version == $version
                and ."dist.shasum" == $shasum
                and ."dist.integrity" == $integrity'
          }

          if metadata=$(read_metadata); then
            if is_exact_package <<< "$metadata"; then
              echo "$package_specifier already contains this exact archive."
              exit 0
            fi
            echo "$package_specifier already exists with different bytes." >&2
            exit 1
          fi

          npx --yes "$NPM_CLI" publish "$TARBALL" \
            --access public \
            --ignore-scripts \
            --provenance

          for attempt in {1..10}; do
            if metadata=$(read_metadata) && is_exact_package <<< "$metadata"; then
              echo "Published $package_specifier with exact archive bytes."
              exit 0
            fi
            if [[ "$attempt" -lt 10 ]]; then
              sleep 3
            fi
          done

          echo "The published CLI did not reach its exact registry bytes." >&2
          exit 1

  verify:
    name: Verify publication
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-package
          path: .

      - name: Download publication verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-verifier
          path: .

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify exact publication
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
          EXPECTED_VERIFIER_SHA256: ${{ needs.build.outputs.verifier_sha256 }}
          EXPECTED_VERIFIER_SIZE: ${{ needs.build.outputs.verifier_size }}
          NPM_CLI: npm@12.0.2
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          TARBALL: ${{ github.workspace }}/${{ needs.build.outputs.archive }}
          VERIFIER: ${{ github.workspace }}/provenance.mjs
        run: |
          npm_version=$(npx --yes "$NPM_CLI" --version)
          if [[ "$npm_version" != "${NPM_CLI#npm@}" ]]; then
            echo "Publication verification requires the pinned npm CLI." >&2
            exit 1
          fi
          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" \
            || -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "Publication verification must not receive OIDC identity." >&2
            exit 1
          fi

          actual_sha256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)
          actual_size=$(stat --format='%s' "$TARBALL")
          actual_verifier_sha256=$(sha256sum "$VERIFIER" | cut -d ' ' -f 1)
          actual_verifier_size=$(stat --format='%s' "$VERIFIER")
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" \
            || "$actual_size" != "$EXPECTED_SIZE" \
            || "$actual_verifier_sha256" != "$EXPECTED_VERIFIER_SHA256" \
            || "$actual_verifier_size" != "$EXPECTED_VERIFIER_SIZE" ]]; then
            echo "Publication verification received unexpected artifact bytes." >&2
            exit 1
          fi

          package_json=$(tar -xOf "$TARBALL" package/package.json)
          package_name=$(jq -er '.name' <<< "$package_json")
          package_version=$(jq -er '.version' <<< "$package_json")
          if [[ "$package_name" != "@nakafa/cli" ]]; then
            echo "Publication verification received an unexpected package." >&2
            exit 1
          fi
          package_specifier="$package_name@$package_version"
          expected_shasum=$(sha1sum "$TARBALL" | cut -d ' ' -f 1)
          expected_sha512=$(sha512sum "$TARBALL" | cut -d ' ' -f 1)
          expected_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          encoded_package_name="${package_name/\//%2f}"
          expected_attestation_url="https://registry.npmjs.org/-/npm/v1/attestations/$encoded_package_name@$package_version"
          expected_repository="https://github.com/$GITHUB_REPOSITORY"

          read_metadata() {
            local raw
            if ! raw=$(npx --yes "$NPM_CLI" view "$package_specifier" \
              name version dist.shasum dist.integrity dist.attestations \
              --json 2>/dev/null); then
              return 1
            fi
            jq -ce '
              if type == "array" and length == 1 then .[0]
              elif type == "object" then .
              else empty
              end
            ' <<< "$raw"
          }

          is_exact_package() {
            jq -e \
              --arg integrity "$expected_integrity" \
              --arg name "$package_name" \
              --arg shasum "$expected_shasum" \
              --arg attestation_url "$expected_attestation_url" \
              --arg version "$package_version" \
              '.name == $name
                and .version == $version
                and ."dist.shasum" == $shasum
                and ."dist.integrity" == $integrity
                and ."dist.attestations".url == $attestation_url
                and ."dist.attestations".provenance.predicateType
                  == "https://slsa.dev/provenance/v1"'
          }

          read_verified_provenance() {
            local audit_file audit_root
            audit_root=$(mktemp -d "$RUNNER_TEMP/npm-audit.XXXXXX")
            audit_file="$audit_root/audit.json"
            if (
              set -euo pipefail
              cd "$audit_root"
              npx --yes "$NPM_CLI" init --yes >/dev/null
              npx --yes "$NPM_CLI" install --save-exact --ignore-scripts \
                --no-audit --no-fund "$package_specifier" >/dev/null
              npx --yes "$NPM_CLI" audit signatures --json \
                --include-attestations > "$audit_file"
              node "$VERIFIER" \
                "$audit_file" \
                "$package_name" \
                "$package_version" \
                "$expected_sha512" \
                "$expected_repository" \
                ".github/workflows/cli-publish.yml" \
                "refs/heads/main" \
                "$GITHUB_SHA" \
                "npm-production"
            ); then
              rm -r -- "$audit_root"
              return 0
            fi
            rm -r -- "$audit_root"
            return 1
          }

          is_exact_publication() {
            local metadata
            if ! metadata=$(read_metadata) \
              || ! is_exact_package <<< "$metadata" \
              || ! read_verified_provenance; then
              return 1
            fi
          }

          for attempt in {1..10}; do
            if is_exact_publication; then
              echo "Verified $package_specifier with exact npm provenance."
              exit 0
            fi
            if [[ "$attempt" -lt 10 ]]; then
              sleep 3
            fi
          done

          echo "The CLI publication did not reach its exact verified state." >&2
          exit 1
