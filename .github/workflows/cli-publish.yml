name: Release CLI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  build:
    name: Verify
    if: github.ref == 'refs/heads/main' && github.repository == 'nakafaai/nakafa.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      size: ${{ steps.archive.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Verify package
        run: |
          pnpm --filter @nakafa/cli typecheck
          pnpm --filter @nakafa/cli test:coverage
          pnpm --filter @nakafa/cli build

      - name: Build release archive
        id: archive
        env:
          ARCHIVE_ROOT: ${{ runner.temp }}/cli-package
        run: |
          mkdir -p "$ARCHIVE_ROOT"
          pack=$(npm pack packages/cli --ignore-scripts --json \
            --pack-destination "$ARCHIVE_ROOT")
          archive=$(jq -er '.[0].filename' <<< "$pack")
          tarball="$ARCHIVE_ROOT/$archive"
          package_json=$(tar -xOf "$tarball" package/package.json)
          package_name=$(jq -er '.name' <<< "$package_json")
          package_version=$(jq -er '.version' <<< "$package_json")
          if [[ "$package_name" != "@nakafa/cli" ]]; then
            echo "The CLI archive has an unexpected package identity." >&2
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "CLI production releases require a stable semantic version." >&2
            exit 1
          fi
          {
            echo "archive=$archive"
            echo "sha256=$(sha256sum "$tarball" | cut -d ' ' -f 1)"
            echo "size=$(stat --format='%s' "$tarball")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: cli-package
          path: ${{ runner.temp }}/cli-package/${{ steps.archive.outputs.archive }}
          retention-days: 1

  publish:
    name: Publish
    needs: build
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download verified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-package
          path: .

      - name: Verify and publish exact archive
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
          NPM_CLI: npm@12.0.2
          TARBALL: ${{ needs.build.outputs.archive }}
        run: |
          npm_version=$(npx --yes "$NPM_CLI" --version)
          if [[ "$npm_version" != "${NPM_CLI#npm@}" ]]; then
            echo "The trusted publisher requires the pinned npm CLI." >&2
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" \
            || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "The trusted publisher requires GitHub OIDC identity." >&2
            exit 1
          fi

          actual_sha256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)
          actual_size=$(stat --format='%s' "$TARBALL")
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" \
            || "$actual_size" != "$EXPECTED_SIZE" ]]; then
            echo "The transported CLI archive differs from the verified build output." >&2
            exit 1
          fi

          package_json=$(tar -xOf "$TARBALL" package/package.json)
          package_name=$(jq -er '.name' <<< "$package_json")
          package_version=$(jq -er '.version' <<< "$package_json")
          if [[ "$package_name" != "@nakafa/cli" ]]; then
            echo "The transported CLI archive has an unexpected package identity." >&2
            exit 1
          fi
          package_specifier="$package_name@$package_version"
          expected_shasum=$(sha1sum "$TARBALL" | cut -d ' ' -f 1)
          expected_sha512=$(sha512sum "$TARBALL" | cut -d ' ' -f 1)
          expected_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          encoded_package_name="${package_name/\//%2f}"
          expected_attestation_url="https://registry.npmjs.org/-/npm/v1/attestations/$encoded_package_name@$package_version"
          expected_repository="https://github.com/$GITHUB_REPOSITORY"
          expected_dependency="git+https://github.com/$GITHUB_REPOSITORY@refs/heads/main"

          read_metadata() {
            local raw
            if ! raw=$(npx --yes "$NPM_CLI" view "$package_specifier" \
              name version dist.shasum dist.integrity dist.attestations \
              --json 2>/dev/null); then
              return 1
            fi
            jq -ce '
              if type == "array" and length == 1 then .[0]
              elif type == "object" then .
              else empty
              end
            ' <<< "$raw"
          }

          is_exact_package() {
            jq -e \
              --arg integrity "$expected_integrity" \
              --arg name "$package_name" \
              --arg shasum "$expected_shasum" \
              --arg attestation_url "$expected_attestation_url" \
              --arg version "$package_version" \
              '.name == $name
                and .version == $version
                and ."dist.shasum" == $shasum
                and ."dist.integrity" == $integrity
                and ."dist.attestations".url == $attestation_url
                and ."dist.attestations".provenance.predicateType
                  == "https://slsa.dev/provenance/v1"'
          }

          read_verified_provenance() {
            local audit_root raw
            audit_root=$(mktemp -d "$RUNNER_TEMP/npm-audit.XXXXXX")
            if ! raw=$(
              set -euo pipefail
              cd "$audit_root"
              npx --yes "$NPM_CLI" init --yes >/dev/null
              npx --yes "$NPM_CLI" install --save-exact --ignore-scripts \
                --no-audit --no-fund "$package_specifier" >/dev/null
              npx --yes "$NPM_CLI" audit signatures --json \
                --include-attestations
            ); then
              return 1
            fi
            jq -ce \
              --arg attestation_url "$expected_attestation_url" \
              --arg name "$package_name" \
              --arg version "$package_version" \
              'if (.invalid | length) != 0 or (.missing | length) != 0 then
                empty
              else
                [.verified[] | select(
                  .name == $name
                  and .version == $version
                  and .attestations.url == $attestation_url
                  and .attestations.provenance.predicateType
                    == "https://slsa.dev/provenance/v1"
                )]
                | if length == 1 then .[0].attestationBundles else empty end
                | map(select(
                    .predicateType == "https://slsa.dev/provenance/v1"
                  ))
                | if length == 1 then
                    .[0].bundle.dsseEnvelope.payload | @base64d | fromjson
                  else empty
                  end
              end
            ' <<< "$raw"
          }

          is_exact_provenance() {
            jq -e \
              --arg dependency "$expected_dependency" \
              --arg repository "$expected_repository" \
              --arg sha "$GITHUB_SHA" \
              --arg sha512 "$expected_sha512" \
              '(.subject | length == 1)
                and .subject[0].digest.sha512 == $sha512
                and .predicate.buildDefinition.buildType
                  == "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1"
                and .predicate.buildDefinition.externalParameters.workflow.repository
                  == $repository
                and .predicate.buildDefinition.externalParameters.workflow.path
                  == ".github/workflows/cli-publish.yml"
                and .predicate.buildDefinition.externalParameters.workflow.ref
                  == "refs/heads/main"
                and (.predicate.buildDefinition.resolvedDependencies | any(
                  .uri == $dependency and .digest.gitCommit == $sha
                ))
                and .predicate.runDetails.builder.id
                  == "https://github.com/actions/runner/github-hosted"'
          }

          is_exact_publication() {
            local metadata provenance
            if ! metadata=$(read_metadata) \
              || ! is_exact_package <<< "$metadata" \
              || ! provenance=$(read_verified_provenance) \
              || ! is_exact_provenance <<< "$provenance"; then
              return 1
            fi
          }

          if read_metadata >/dev/null 2>&1; then
            if is_exact_publication; then
              echo "$package_specifier already matches this exact trusted publication."
              exit 0
            fi
            echo "$package_specifier already exists but does not match this release." >&2
            exit 1
          fi

          npx --yes "$NPM_CLI" publish "$TARBALL" --access public --provenance

          for attempt in {1..10}; do
            if is_exact_publication; then
              echo "Verified $package_specifier with exact npm provenance."
              exit 0
            fi
            if [[ "$attempt" -lt 10 ]]; then
              sleep 3
            fi
          done

          echo "The published CLI did not reach its exact verified registry state." >&2
          exit 1
