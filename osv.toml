# Advisories that no upgrade here can clear: no patched release exists, or every patched
# release breaks a dependency the runtime requires. An entry reaches only development
# tooling, or a feature this repository does not enable.
# Add an entry in its own change, with ignoreUntil at most 14 days out and a reason
# that names the dependency path and why the advisory cannot be exploited.
# Each entry expires on its ignoreUntil date and the audit fails again, so it is reviewed
# then; delete it as soon as a patched release ships that the runtime can take.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-11-27
reason = "deepmerge 4.3.1 is the newest release and the advisory lists no fix (vulnerable >= 4.2.0, <= 4.3.1, no patched version). Only the root devDependency ultracite reaches it (ultracite -> deepmerge), which merges its own preset objects while it writes or checks lint configuration, so no untrusted object reaches mergeObject. The runtime path (@react-email/render -> html-to-text 9 -> deepmerge) is gone: @react-email/render 2.2.0 uses html-to-text 10, which merges with deepmerge-ts. Checked on 13 November 2026: deepmerge 4.3.1 is still the newest release, and ultracite 8.2.0, its newest, still depends on deepmerge ^4.3.1."

