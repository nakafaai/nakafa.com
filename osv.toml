# Advisories with no patched release that reach only development tooling.
# Add an entry in its own change, with ignoreUntil at most 14 days out and a reason
# that names the dependency path and why the advisory cannot be exploited.
# Each entry expires on its ignoreUntil date and the audit fails again, so it is reviewed
# then; delete it as soon as a patched release ships.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-10-30
reason = "braces <=3.0.3 has no patched release, and 3.0.3 is the newest release. Only the root devDependency ultracite reaches it (ultracite -> fast-glob -> micromatch -> braces, and ultracite -> find-workspaces -> fast-glob -> micromatch -> braces). Ultracite gives fast-glob only fixed patterns, and find-workspaces expands the workspace globs of this repository's own pnpm-workspace.yaml, so no untrusted input reaches the brace expansion."
