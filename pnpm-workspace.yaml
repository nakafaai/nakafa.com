packages:
  - apps/*
  - packages/*

engineStrict: true
minimumReleaseAge: 0
savePrefix: ""

update:
  ignoreDeps:
    - '@ai-sdk/devtools'
    - '@ai-sdk/gateway'
    - '@ai-sdk/google'
    - '@ai-sdk/react'
    - '@biomejs/biome'
    - '@convex-dev/better-auth'
    - '@effect/platform-node'
    - '@effect/tsgo'
    - '@effect/vitest'
    - '@nakafa/aksara-contracts'
    - '@next/third-parties'
    - '@turbo/gen'
    - '@types/node'
    - '@vitest/coverage-istanbul'
    - '@vitest/ui'
    - ai
    - auth
    - better-auth
    - convex
    - effect
    - next
    - node
    - pnpm
    - turbo
    - typescript
    - ultracite
    - vitest

catalog:
  '@effect/platform-node': 4.0.0-rc.112
  '@effect/vitest': 4.0.0-rc.112
  '@vitest/coverage-istanbul': 4.1.11
  '@vitest/ui': 4.1.11
  effect: 4.0.0-rc.112
  typescript: 7.0.2
  vitest: 4.1.11

overrides:
  "@ai-sdk/devtools@1.0.15>@hono/node-server": "2.1.1"
  "@ai-sdk/devtools@1.0.15>hono": "4.13.5"
  "@changesets/parse@0.4.3>js-yaml": "4.3.1"
  "@effect/platform-node-shared": "4.0.0-rc.112"
  "@hono/node-server@2.1.1>hono": "4.13.5"
  "@react-email/ui@6.9.3>next": "16.3.4"
  "@vercel/routing-utils@6.5.0>path-to-regexp": "6.3.0"
  "@vitest/coverage-istanbul@4.1.11>@babel/core": "7.29.7"
  "auth@1.6.30>@babel/core": "7.29.7"
  "convex-helpers": "0.1.124"
  "fast-uri": "3.1.6"
  "ip-address": "10.4.0"
  "lodash": "4.18.1"
  "minimatch@10.2.5>brace-expansion": "5.0.9"
  "mermaid@11.17.2>dompurify": "^3.4.13"
  "next@16.3.4>postcss": "8.5.28"
  "read-yaml-file@1.1.0>js-yaml": "3.15.1"

allowBuilds:
  '@parcel/watcher': true
  '@posthog/cli': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true
