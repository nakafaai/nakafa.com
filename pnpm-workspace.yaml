packages:
  - apps/*
  - packages/*

engineStrict: true
minimumReleaseAge: 0
savePrefix: ""

update:
  ignoreDeps:
    - 'mermaid'
    - '@types/react-dom'
    - '@types/react'
    - 'react-dom'
    - 'react'
    - '@ai-sdk/devtools'
    - '@ai-sdk/gateway'
    - '@ai-sdk/google'
    - '@ai-sdk/react'
    - '@biomejs/biome'
    - '@convex-dev/better-auth'
    - '@effect/platform-node'
    - '@effect/tsgo'
    - '@effect/vitest'
    - '@nakafa/aksara-contracts'
    - '@next/third-parties'
    - '@turbo/gen'
    - '@types/node'
    - '@vitest/coverage-istanbul'
    - '@vitest/ui'
    - ai
    - auth
    - better-auth
    - convex
    - effect
    - next
    - node
    - pnpm
    - turbo
    - typescript
    - ultracite
    - vitest

catalog:
  '@effect/platform-node': 4.0.0-rc.115
  '@effect/vitest': 4.0.0-rc.115
  '@vitest/coverage-istanbul': 5.0.0
  '@vitest/ui': 5.0.0
  effect: 4.0.0-rc.115
  typescript: 7.0.2
  vitest: 5.0.0

overrides:
  "react": "19.2.8"
  "react-dom": "19.2.8"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.7"
  "@effect/platform-node-shared": "4.0.0-rc.115"
  "@react-email/ui@6.9.5>next": "16.3.5"
  "@vercel/routing-utils@6.5.0>path-to-regexp": "6.3.0"
  "auth@1.6.31>@babel/core": "7.29.7"
  "convex-helpers": "0.1.124"
  "fast-uri": "3.1.6"
  "ip-address": "10.7.0"
  "lodash": "4.18.1"
  "mermaid@11.17.2>dompurify": "^3.4.13"
  "next@16.3.5>postcss": "8.5.28"

# The tested test-utils-only exception is recorded in scripts/dependencies/policy.ts.
peerDependencyRules:
  allowedVersions:
    "better-auth@1.6.31>vitest": "5.0.0"

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true
