packages:
  - apps/*
  - packages/*

engineStrict: true
minimumReleaseAge: 0
savePrefix: ""

update:
  ignoreDeps:
    - 'mermaid'
    - '@types/react-dom'
    - '@types/react'
    - 'react-dom'
    - 'react'
    - '@ai-sdk/gateway'
    - '@ai-sdk/google'
    - '@biomejs/biome'
    - '@convex-dev/better-auth'
    - '@effect/platform-node'
    - '@effect/tsgo'
    - '@effect/vitest'
    - '@nakafa/aksara-contracts'
    - '@polar-sh/sdk'
    - '@react-three/fiber'
    - '@next/third-parties'
    - '@turbo/gen'
    - '@types/node'
    - '@vitest/coverage-istanbul'
    - '@vitest/ui'
    - ai
    - auth
    - better-auth
    - convex
    - effect
    - next
    - node
    - pnpm
    - turbo
    - typescript
    - ultracite
    - vitest

catalog:
  '@effect/platform-node': 4.0.0-rc.117
  '@effect/vitest': 4.0.0-rc.117
  '@vitest/coverage-istanbul': 5.0.2
  '@vitest/ui': 5.0.2
  effect: 4.0.0-rc.117
  typescript: 7.0.2
  vitest: 5.0.2

overrides:
  "react": "19.2.8"
  "react-dom": "19.2.8"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.7"
  "@effect/platform-node-shared": "4.0.0-rc.117"
  "@react-email/ui@6.11.0>next": "16.3.7"
  "@vercel/routing-utils@6.6.0>path-to-regexp": "6.3.0"
  "@scalar/json-magic@0.15.3>undici": "7.29.1"
  "auth@1.6.33>@babel/core": "7.29.7"
  "convex-helpers": "0.1.124"
  "fast-uri": "3.1.8"
  "ip-address": "10.7.2"
  "lodash": "4.18.1"
  "mermaid@11.17.2>dompurify": "^3.4.13"
  "next@16.3.7>postcss": "8.5.28"

# The tested test-utils-only exception is recorded in scripts/dependencies/policy.ts.
peerDependencyRules:
  allowedVersions:
    "better-auth@1.6.33>vitest": "5.0.2"

# The Next integration imports next/headers.js but omits its framework peer.
# Resolve it from the consuming app so request storage has one identity.
packageExtensions:
  "@convex-dev/better-auth@0.12.5":
    peerDependencies:
      next: "^16.0.0"
    peerDependenciesMeta:
      next:
        optional: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true
