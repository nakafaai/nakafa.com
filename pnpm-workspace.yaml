packages:
  - apps/*
  - packages/*

engineStrict: true
minimumReleaseAge: 0
savePrefix: ""

update:
  ignoreDeps:
    - 'mermaid'
    - '@types/react-dom'
    - '@types/react'
    - 'react-dom'
    - 'react'
    - '@biomejs/biome'
    - '@convex-dev/ai-sdk-provider'
    - '@convex-dev/better-auth'
    - '@effect/platform-browser'
    - '@effect/platform-node'
    - '@effect/tsgo'
    - '@effect/vitest'
    - '@nakafa/aksara-contracts'
    - '@react-three/fiber'
    - afdocs
    - '@next/third-parties'
    - '@turbo/gen'
    - '@types/node'
    - '@vitest/coverage-istanbul'
    - '@vitest/ui'
    - ai
    - auth
    - better-auth
    - convex
    - effect
    - next
    - node
    - pnpm
    - turbo
    - typescript
    - ultracite
    - vitest

catalog:
  '@convex-dev/ai-sdk-provider': 0.2.1
  '@effect/platform-browser': 4.0.1
  '@effect/platform-node': 4.0.1
  '@effect/vitest': 4.0.1
  '@vitest/coverage-istanbul': 5.0.3
  '@vitest/ui': 5.0.3
  ai: 7.0.130
  effect: 4.0.1
  typescript: 7.0.2
  vitest: 5.0.3

overrides:
  "react": "19.2.8"
  "react-dom": "19.2.8"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.7"
  "@effect/ai-openai-compat": "4.0.1"
  "@effect/ai-openrouter": "4.0.1"
  "@effect/platform-node": "4.0.1"
  "@effect/platform-node-shared": "4.0.1"
  "@react-email/ui@6.11.1>next": "16.4.0"
  "@vercel/routing-utils@6.6.0>path-to-regexp": "6.3.0"
  "auth@1.6.33>@babel/core": "7.29.7"
  "axios": "1.20.0"
  "convex-helpers": "0.1.126"
  "fast-uri": "3.1.8"
  "ip-address": "10.7.2"
  "lodash": "4.18.1"
  "mermaid@11.17.2>dompurify": "^3.4.16"
  "mermaid@11.17.2>katex": "0.19.0"
  "micromark-extension-math@3.1.0>katex": "0.19.0"
  "next@16.4.0>postcss": "8.5.29"
  "source-map-js": "1.2.2"

# The tested test-utils-only exception is recorded in scripts/dependencies/policy.ts.
peerDependencyRules:
  allowedVersions:
    "better-auth@1.6.33>vitest": "5.0.3"

# The Next integration imports next/headers.js but omits its framework peer.
# Resolve it from the consuming app so request storage has one identity.
packageExtensions:
  "@convex-dev/better-auth@0.12.5":
    peerDependencies:
      next: "^16.0.0"
    peerDependenciesMeta:
      next:
        optional: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true
