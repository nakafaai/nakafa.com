packages:
  - apps/*
  - packages/*

engineStrict: true
minimumReleaseAge: 0
savePrefix: ""

update:
  ignoreDeps:
    - 'mermaid'
    - '@types/react-dom'
    - '@types/react'
    - 'react-dom'
    - 'react'
    - '@biomejs/biome'
    - '@convex-dev/ai-sdk-provider'
    - '@convex-dev/better-auth'
    - '@effect/platform-browser'
    - '@effect/platform-node'
    - '@effect/tsgo'
    - '@effect/vitest'
    - '@nakafa/aksara-contracts'
    - '@react-three/fiber'
    - afdocs
    - '@next/third-parties'
    - '@turbo/gen'
    - '@types/node'
    - '@vitest/coverage-istanbul'
    - '@vitest/ui'
    - ai
    - auth
    - better-auth
    - convex
    - effect
    - next
    - node
    - pnpm
    - turbo
    - typescript
    - ultracite
    - vitest

catalog:
  '@confect/core': 10.1.0
  '@convex-dev/agent': 0.7.7
  '@convex-dev/ai-sdk-provider': 0.2.1
  '@effect/platform-browser': 4.0.2
  '@effect/platform-node': 4.0.2
  '@effect/vitest': 4.0.2
  '@hugeicons/core-free-icons': ^4.3.5
  '@hugeicons/react': ^1.1.10
  '@mantine/hooks': ^9.7.1
  '@react-email/render': 2.1.0
  '@shadcn/react': 0.3.1
  '@tailwindcss/postcss': ^4.3.3
  '@vercel/config': ^0.12.0
  '@vitest/coverage-istanbul': 5.0.3
  '@vitest/ui': 5.0.3
  ai: 7.0.136
  class-variance-authority: ^0.7.1
  cn: 0.4.0
  effect: 4.0.2
  motion: ^14.0.0
  next-intl: ^4.14.9
  next-themes: ^0.4.6
  react-email: 6.11.1
  remark-mdx: 3.1.1
  remark-parse: 11.0.0
  server-only: 0.0.1
  sonner: ^2.0.8
  tsx: ^4.23.15
  typescript: 7.0.2
  unified: 11.0.5
  virtua: ^0.53.3
  vite: ^8.3.4
  vitest: 5.0.3
  zustand: ^5.0.15

overrides:
  "react": "19.3.0"
  "react-dom": "19.3.0"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@effect/ai-openai-compat": "4.0.2"
  "@effect/ai-openrouter": "4.0.2"
  "@effect/platform-node": "4.0.2"
  "@effect/platform-node-shared": "4.0.2"
  "@react-email/ui@6.11.1>next": "16.4.0"
  "@vercel/routing-utils@6.6.0>path-to-regexp": "6.3.0"
  "auth@1.6.33>@babel/core": "7.29.7"
  "axios": "1.20.0"
  # One copy for every Convex component: @convex-dev/aggregate pins 0.1.122 exactly,
  # and the agent and workflow peers need ^0.1.127.
  "convex-helpers": "0.1.128"
  "fast-uri": "3.1.8"
  # GHSA-j6r3-76f7-8jcv and GHSA-h3mg-xc3c-68pw affect ip-address 10.7.0 and earlier;
  # 10.7.1 fixes both. The pin keeps the socks path of sigstore, a root devDependency,
  # on a patched release.
  "ip-address": "10.7.2"
  "lodash": "4.18.1"
  "mermaid@11.17.2>dompurify": "^3.4.16"
  "mermaid@11.17.2>katex": "0.19.0"
  "micromark-extension-math@3.1.0>katex": "0.19.0"
  "next@16.4.0>postcss": "8.5.29"
  "source-map-js": "1.2.2"

# The tested test-utils-only exception is recorded in scripts/dependencies/policy.ts.
peerDependencyRules:
  allowedVersions:
    "better-auth@1.6.33>vitest": "5.0.3"

# The Next integration imports next/headers.js but omits its framework peer.
# Resolve it from the consuming app so request storage has one identity.
packageExtensions:
  "@convex-dev/better-auth@0.12.5":
    peerDependencies:
      next: "^16.0.0"
    peerDependenciesMeta:
      next:
        optional: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true
