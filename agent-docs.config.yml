url: http://localhost:3000
options:
  canonicalOrigin: https://nakafa.com
  # UI-only routes have no canonical Markdown source and are not agent docs.
  coverageExclusions:
    - "/[a-z][a-z]"
    - "/[a-z][a-z]/contributor"
    - "/[a-z][a-z]/search"
  maxLinksToTest: 50
  parityExclusions:
    - .katex
    - .katex-mathml
  # The check targets a dedicated local server, so remote-site throttling only
  # delays complete sitemap coverage across immutable content buckets.
  requestDelay: 0
  requestTimeout: 20000
  samplingStrategy: deterministic
  # Quran Markdown keeps one complete surah together. The largest sampled page
  # is 58,115 characters after HTML conversion and remains below the 100K cap.
  thresholds:
    fail: 100000
    pass: 60000
  # A page that is rendered for the first time after a deploy or a publication
  # also carries the stream that Next.js embeds for Partial Prefetching, a
  # second copy of its hydration payload. Measured on the longest surahs: 1.24
  # MB on that first render, and 0.73 to 0.88 MB from the cache afterwards. The
  # default pass line is 1 MB, and the fail line stays at its default.
  transferThresholds:
    fail: 10000000
    pass: 1500000
